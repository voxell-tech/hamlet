[workspace]
resolver = "3"
members = ["crates/*"]
# The vendored fynix workspace is its own workspace.
exclude = ["vendor"]
# `cargo build`, `cargo test` and `cargo clippy` at the root cover every
# crate, so the checks in AGENTS.md need no flags.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/hamlet"

[workspace.dependencies]
# hamlet
hamlet_client = { version = "0.1.0", path = "crates/hamlet_client" }
hamlet_protocol = { version = "0.1.0", path = "crates/hamlet_protocol" }
hamlet_protocol_gen = { version = "0.1.0", path = "crates/hamlet_protocol_gen" }
hamlet_desktop = { version = "0.1.0", path = "crates/hamlet_desktop" }
hamlet_assets = { version = "0.1.0", path = "crates/hamlet_assets" }
hamlet_vfx = { version = "0.1.0", path = "crates/hamlet_vfx" }
hamlet_world = { version = "0.1.0", path = "crates/hamlet_world" }
hamlet_ui = { version = "0.1.0", path = "crates/hamlet_ui" }
hamlet_testing = { version = "0.1.0", path = "crates/hamlet_testing" }

# fynix
bevy_fynix = { path = "vendor/fynix/crates/bevy_fynix" }

# bevy
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui", "mesh_picking", "default_platform", "system_clipboard", "bevy_audio", "bevy_dev_tools", "debug", "serialize"] }
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"] }

# other
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
interprocess = "2"
keyring = "4"
libc = "0.2"
process-wrap = { version = "10.0.1", features = ["tokio1"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rfd = "0.17"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["full"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSData"] }
winit = { version = "0.30", default-features = false }
toml = "1"

[workspace.lints.clippy]
redundant_type_annotations = "warn"
# Bevy systems take many parameters and long query types by nature.
too_many_arguments = "allow"
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "hamlet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Hamlet window client and the examples that draw the world and the panels"

[[bin]]
name = "hamlet-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Named for the `hot-reload` feature; only the examples use it.
hamlet_assets.workspace = true
hamlet_client.workspace = true
hamlet_desktop.workspace = true
hamlet_ui.workspace = true
hamlet_world.workspace = true
anyhow.workspace = true
bevy.workspace = true
bevy_app.workspace = true
tokio.workspace = true

[dev-dependencies]
hamlet_protocol.workspace = true
hamlet_testing.workspace = true
hamlet_vfx.workspace = true
bevy_fynix.workspace = true
serde_json.workspace = true
toml.workspace = true

[features]
# A saved change to a file under assets/ reaches the running app:
# `cargo run --features hot-reload`.
hot-reload = ["hamlet_assets/hot-reload"]

[[example]]
name = "style_test"

[[example]]
name = "town_gen"

[[example]]
name = "far_lands"

[[example]]
name = "ui_gallery"

[[example]]
name = "cursor_sheet"

[[example]]
name = "sound_sheet"

[[example]]
name = "chief_sheet"
