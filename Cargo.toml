[workspace]
resolver = "3"
members = ["crates/*"]
# xtask is a workspace of its own.
exclude = ["xtask"]
# `cargo build`, `cargo test` and `cargo clippy` at the root cover every
# crate, so the checks in AGENTS.md need no flags.
default-members = [".", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
publish = false
repository = "https://github.com/voxell-tech/hamlet"

[workspace.dependencies]
# hamlet
hamlet_client = { version = "0.1.0", path = "crates/hamlet_client" }
hamlet_protocol = { version = "0.1.0", path = "crates/hamlet_protocol" }
hamlet_desktop = { version = "0.1.0", path = "crates/hamlet_desktop" }
hamlet_assets = { version = "0.1.0", path = "crates/hamlet_assets" }
hamlet_vfx = { version = "0.1.0", path = "crates/hamlet_vfx" }
hamlet_realm = { version = "0.1.0", path = "crates/hamlet_realm" }
hamlet_ui = { version = "0.1.0", path = "crates/hamlet_ui" }
hamlet_testing = { version = "0.1.0", path = "crates/hamlet_testing" }
hamlet_acceptance = { version = "0.1.0", path = "crates/hamlet_acceptance" }
hamlet_workspace_wire = { version = "0.1.0", path = "crates/hamlet_workspace_wire" }

# fynix, a git dependency pinned to a commit of its
# nixon/wait-for-theme branch until that is merged and released.
bevy_fynix = { git = "https://github.com/voxell-tech/fynix", rev = "22eae386a96dac9f70e4478e9d315b9daad327eb" }

# bevy
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
# `system_clipboard` has copy and paste in a text box use the system's
# clipboard, not one inside the app.
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui", "mesh_picking", "default_platform", "system_clipboard", "bevy_audio", "bevy_dev_tools", "debug", "serialize"] }
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"] }

# other
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
interprocess = "2"
keyring = "4"
libc = "0.2"
# The text layout Bevy's text is built on, for selecting drawn words.
# Held to the version `bevy_text` uses, so its layouts are this crate's.
parley = { version = "0.9", default-features = false, features = ["std"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rfd = "0.17"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["full"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSData"] }
winit = { version = "0.30", default-features = false }
toml = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
redundant_type_annotations = "warn"
# Bevy systems take many parameters and long query types by nature.
too_many_arguments = "allow"
type_complexity = "allow"
# Unsafe code says why it is sound.
undocumented_unsafe_blocks = "warn"
# A silenced lint says why, and is dropped once it no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# A folder's module is named by its file, never mod.rs.
mod_module_files = "warn"
# Output goes through a log, or is silenced where printing is the job.
print_stdout = "warn"
print_stderr = "warn"
# Plain, uniform control flow and calls.
match_same_arms = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
unwrap_or_default = "warn"
nonstandard_macro_braces = "warn"
# Many bools in a row read as an unlabelled list; take an enum.
fn_params_excessive_bools = "warn"
# Pointer casts say what they change.
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "hamlet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Hamlet window client and the examples that draw the world and the panels"

[[bin]]
name = "hamlet-app"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
# Named for the `hot-reload` feature; only the examples use it.
hamlet_assets.workspace = true
hamlet_client.workspace = true
hamlet_desktop.workspace = true
hamlet_protocol.workspace = true
hamlet_ui.workspace = true
hamlet_realm.workspace = true
anyhow.workspace = true
bevy.workspace = true
bevy_app.workspace = true
tokio.workspace = true

[dev-dependencies]
hamlet_testing.workspace = true
hamlet_vfx.workspace = true
bevy_fynix.workspace = true
serde_json.workspace = true

[features]
# A saved change to a file under assets/ reaches the running app:
# `cargo run --features hot-reload`.
hot-reload = ["hamlet_assets/hot-reload"]

[[example]]
name = "style_test"

[[example]]
name = "town_gen"

[[example]]
name = "far_lands"

[[example]]
name = "ui_gallery"

[[example]]
name = "cursor_sheet"

[[example]]
name = "sound_sheet"

[[example]]
name = "chief_sheet"
