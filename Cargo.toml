[workspace]
resolver = "3"
members = ["crates/*"]
# The vendored fynix and xtask are workspaces of their own.
exclude = [
    "vendor",
    "xtask",
]
# The root holds no package, so `cargo build`, `cargo test` and
# `cargo clippy` there cover every crate and the checks in AGENTS.md
# need no flags.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
publish = false
repository = "https://github.com/voxell-tech/hamlet"

[workspace.dependencies]
# hamlet
hamlet_client = { version = "0.1.0", path = "crates/hamlet_client" }
hamlet_protocol = { version = "0.1.0", path = "crates/hamlet_protocol" }
hamlet_desktop = { version = "0.1.0", path = "crates/hamlet_desktop" }
hamlet_os = { version = "0.1.0", path = "crates/hamlet_os" }
hamlet_assets = { version = "0.1.0", path = "crates/hamlet_assets" }
hamlet_vfx = { version = "0.1.0", path = "crates/hamlet_vfx" }
hamlet_realm = { version = "0.1.0", path = "crates/hamlet_realm" }
hamlet_ui = { version = "0.1.0", path = "crates/hamlet_ui" }
hamlet_testing = { version = "0.1.0", path = "crates/hamlet_testing" }
hamlet_acceptance = { version = "0.1.0", path = "crates/hamlet_acceptance" }
hamlet_store = { version = "0.1.0", path = "crates/hamlet_store" }
hamlet_git = { version = "0.1.0", path = "crates/hamlet_git" }
hamlet_sandbox = { version = "0.1.0", path = "crates/hamlet_sandbox" }
hamlet_workspace_wire = { version = "0.1.0", path = "crates/hamlet_workspace_wire" }
hamlet_update = { version = "0.1.0", path = "crates/hamlet_update" }
# The actor runtime, ported. Each crate holds Apache-2.0 code; see its NOTICE.
hamlet_actor_client = { version = "0.1.0", path = "crates/hamlet_actor_client" }
hamlet_actor_core = { version = "0.1.0", path = "crates/hamlet_actor_core" }
hamlet_actor_error = { version = "0.1.0", path = "crates/hamlet_actor_error" }
hamlet_actor_error_macros = { version = "0.1.0", path = "crates/hamlet_actor_error_macros" }
hamlet_actor_wire = { version = "0.1.0", path = "crates/hamlet_actor_wire" }
# The actor runtime, Hamlet's own code under the workspace licence.
hamlet_host = { version = "0.1.0", path = "crates/hamlet_host" }
hamlet_sqlite = { version = "0.1.0", path = "crates/hamlet_sqlite" }

# fynix
bevy_fynix = { path = "vendor/fynix/crates/bevy_fynix" }

# bevy
bevy_app = { version = "0.20", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.20", default-features = false, features = ["std"] }
bevy_asset = { version = "0.20", default-features = false }
bevy_color = { version = "0.20", default-features = false, features = ["std"] }
bevy_image = { version = "0.20", default-features = false }
bevy_log = { version = "0.20", default-features = false }
bevy_math = { version = "0.20", default-features = false, features = ["std"] }
bevy_reflect = { version = "0.20", default-features = false, features = ["std"] }
bevy_time = { version = "0.20", default-features = false, features = ["std"] }
bevy_window = { version = "0.20", default-features = false, features = ["std"] }
bevy_winit = { version = "0.20", default-features = false }
# No features here: each crate names the ones its code needs, and
# hamlet_app the product's.
bevy = { version = "0.20", default-features = false }
# Its Bevy 0.20 port is not released yet: held to a commit of its main.
bevy_hanabi = { git = "https://github.com/djeedai/bevy_hanabi", rev = "d277555d4a2350da6787245d15c56c62c739594d", default-features = false, features = ["3d"] }

# Used by the actor runtime's crates: the ported ones, at the versions
# they were ported with, and hamlet_host, hamlet_sqlite and
# hamlet_killkit, which share parking_lot, rusqlite, tracing and
# tracing-subscriber with them.
async-trait = "0.1"
bytes = "1.6.0"
chrono-tz = "0.10.4"
ciborium = "0.2"
croner = "2.2.0"
http = "1.3.1"
indoc = "2.0.5"
lazy_static = "1.4"
opentelemetry-http = "0.28"
parking_lot = "0.12"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
prometheus = "0.14"
quote = "1.0"
rand = "0.8"
# Held to the version whose SQLite is Diesel's, so both share one build.
rusqlite = { version = "0.40", features = ["bundled"] }
scc = "3.6.12"
serde_bare = "0.5.0"
subtle = "2"
syn = { version = "2.0", features = ["full", "extra-traits"] }
tokio-util = "0.7"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3", default-features = false, features = ["ansi", "fmt", "json", "env-filter"] }
vbare = "0.2.0"
vbare-compiler = "0.2.0"

# other
# The version bevy_a11y uses, which it no longer re-exports.
accesskit = { version = "0.24", default-features = false }
anyhow = "1"
# The system clipboard, for the images on it; Bevy's own copy of it
# holds text and raw pixels only.
arboard = { version = "3.7", default-features = false, features = ["image-data"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
diesel = { version = "2.3", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35", "32-column-tables"] }
futures = "0.3"
# Each scholar's repository, kept by the server with no git program.
gix = { version = "0.90", default-features = false, features = ["sha1", "merge", "revision"] }
image ={ version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
interprocess = "2"
# SQLite itself, built in, for Diesel.
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
keyring = "4"
libc = "0.2"
# The text layout Bevy's text is built on, for selecting drawn words.
# Held to the version `bevy_text` uses, so its layouts are this crate's.
parley = { version = "0.11", default-features = false, features = ["std"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rfd = "0.17"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
# The model providers' marks, drawn from their SVGs. No text or fonts.
resvg = { version = "0.48.1", default-features = false }
rustix = "1"
serde = { version = "1.0.229", features = ["derive"] }
schemars = "1.2.3"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
unicode-segmentation = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
tokio-tungstenite = "0.28"
tokio = { version = "1", features = ["full"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSArray", "NSData", "NSEnumerator", "NSThread"] }
winit = { version = "0.30", default-features = false }
windows-sys = "0.61"
toml = "1"
# The desktop portal, asked whether the computer is light or dark.
zbus = { version = "6", default-features = false, features = ["tokio", "proxy"] }

[workspace.lints.rust]
# Unsafe code lives only in the modules that say so.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"
# The actor core reads Tokio's unstable runtime metrics when built with
# `--cfg tokio_unstable`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[workspace.lints.clippy]
redundant_type_annotations = "warn"
# Bevy systems take many parameters and long query types by nature.
too_many_arguments = "allow"
type_complexity = "allow"
# Unsafe code says why it is sound.
undocumented_unsafe_blocks = "warn"
# A silenced lint says why, and is dropped once it no longer fires.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# A folder's module is named by its file, never mod.rs.
mod_module_files = "warn"
# Output goes through a log, or is silenced where printing is the job.
print_stdout = "warn"
print_stderr = "warn"
# Plain, uniform control flow and calls.
match_same_arms = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else = "warn"
unwrap_or_default = "warn"
nonstandard_macro_braces = "warn"
# Many bools in a row read as an unlabelled list; take an enum.
fn_params_excessive_bools = "warn"
# Pointer casts say what they change.
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
ref_as_ptr = "warn"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Dependencies are optimized, and carry no debug info: with it, the
# feature sets the checks build fill target/debug/deps with over
# 100 GB of objects.
[profile.dev.package."*"]
opt-level = 3
debug = false

