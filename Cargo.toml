[workspace]
resolver = "3"
members = ["crates/*", "engine/*"]
# The vendored fynix workspace is its own workspace. The engine's
# tuning files and its WIT are files, not crates, each sample plugin
# is a workspace of its own, and the plugins that come with Hamlet are
# one, all built for wasm32-wasip2.
exclude = ["vendor", "engine/tuning", "engine/wit", "engine/samples", "plugins"]
# `cargo build`, `cargo test` and `cargo clippy` at the root cover every
# crate, so the checks in AGENTS.md need no flags.
default-members = [".", "crates/*", "engine/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/hamlet"

[workspace.dependencies]
# hamlet
hamlet_desktop = { version = "0.1.0", path = "crates/hamlet_desktop" }
hamlet_assets = { version = "0.1.0", path = "crates/hamlet_assets" }
hamlet_vfx = { version = "0.1.0", path = "crates/hamlet_vfx" }
hamlet_realm = { version = "0.1.0", path = "crates/hamlet_realm" }
hamlet_ui = { version = "0.1.0", path = "crates/hamlet_ui" }

# the agent core, in the engine
hamlet_sandbox = { version = "0.1.0", path = "engine/sandbox" }
hamlet_model = { version = "0.1.0", path = "engine/model" }
hamlet_home = { version = "0.1.0", path = "engine/home" }
hamlet_rules = { version = "0.1.0", path = "engine/rules" }
hamlet_core = { version = "0.1.0", path = "engine/agent_core" }
hamlet_testing = { version = "0.1.0", path = "engine/testing" }

# the engine
hamlet_engine_api = { version = "0.1.0", path = "engine/api" }
hamlet_engine_core = { version = "0.1.0", path = "engine/core" }
hamlet_engine_shell = { version = "0.1.0", path = "engine/shell" }
hamlet_engine_plugins = { version = "0.1.0", path = "engine/plugins" }
hamlet_engine_grants = { version = "0.1.0", path = "engine/grants" }
hamlet_engine_assets = { version = "0.1.0", path = "engine/assets" }
hamlet_engine_bus = { version = "0.1.0", path = "engine/bus" }
hamlet_engine_net = { version = "0.1.0", path = "engine/net" }
hamlet_engine_agents = { version = "0.1.0", path = "engine/agents" }
hamlet_engine_desktop = { version = "0.1.0", path = "engine/desktop" }
hamlet_engine_render = { version = "0.1.0", path = "engine/render" }
hamlet_engine_wasm = { version = "0.1.0", path = "engine/wasm" }
hamlet_engine_harness = { version = "0.1.0", path = "engine/harness" }
hamlet_engine_sdk = { version = "0.1.0", path = "engine/sdk" }
hamlet_engine_bevy = { version = "0.1.0", path = "engine/bevy_sdk" }

# fynix
fynix = { path = "vendor/fynix/crates/fynix" }
bevy_fynix = { path = "vendor/fynix/crates/bevy_fynix" }
# `#[element]` derives `Lenz`, whose output names this crate.
lenz = "0.1.0"

# bevy
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
# For plugins built with `hamlet_engine_bevy`: no rendering, no threads.
bevy_math = { version = "0.19", default-features = false, features = ["std"] }
bevy_time = { version = "0.19", default-features = false }
bevy_transform = { version = "0.19", default-features = false, features = ["std", "bevy-support"] }
# `system_clipboard` has copy and paste in a text box use the system's
# clipboard, not one inside the app.
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui", "mesh_picking", "default_platform", "system_clipboard", "bevy_audio", "bevy_dev_tools", "debug", "serialize"] }
# Checks plugins' WGSL; held to the version Bevy's wgpu uses.
naga = { version = "29", default-features = false, features = ["wgsl-in"] }
# The timestamp queries Bevy does not re-export; held to its version.
wgpu = { version = "29", default-features = false }
bevy_hanabi ={ version = "0.19", default-features = false, features = ["3d"] }

# other
anyhow ="1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
interprocess = "2"
keyring = "4"
libc = "0.2"
# The text layout Bevy's text is built on, for selecting drawn words.
# Held to the version `bevy_text` uses, so its layouts are this crate's.
parley = { version = "0.9", default-features = false, features = ["std"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
pulldown-cmark = { version = "0.13", default-features = false }
regex = "1"
rfd = "0.17"
ring = "0.17"
ron = "0.12"
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSData"] }
winit = { version = "0.30", default-features = false }
toml = "1"
# The guest side of the engine's WIT, for plugins.
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc", "std"] }
# The WASM engine, pinned to a stable release. Only `hamlet_engine_wasm`
# names it.
wasmtime = { version = "=49.0.3", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "pooling-allocator"] }
# The system interface a plugin is given, held to wasmtime's version.
wasmtime-wasi = { version = "=49.0.3", default-features = false, features = ["p2"] }
# Test plugins: core modules in text, made into components against the
# WIT file.
wat = "1.262"
wit-component = "0.262"
wit-parser = "0.262"

[workspace.lints.clippy]
redundant_type_annotations = "warn"
# Bevy systems take many parameters and long query types by nature.
too_many_arguments = "allow"
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "hamlet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The hamlet binary and the examples that draw the world and the panels"

[lints]
workspace = true

[dependencies]
# Named for the `hot-reload` feature; only the examples use it.
hamlet_assets.workspace = true
hamlet_sandbox.workspace = true
hamlet_model.workspace = true
hamlet_home.workspace = true
hamlet_core.workspace = true
hamlet_desktop.workspace = true
hamlet_ui.workspace = true
hamlet_realm.workspace = true
anyhow.workspace = true
bevy.workspace = true
bevy_app.workspace = true
tokio.workspace = true

[dev-dependencies]
hamlet_rules.workspace = true
hamlet_vfx.workspace = true
bevy_fynix.workspace = true
serde_json.workspace = true

[features]
# Tests that reach a real model server or the internet. Off unless asked
# for: `cargo test --features live-tests`.
live-tests = ["hamlet_core/live-tests"]
# A saved change to a file under assets/ reaches the running app:
# `cargo run --features hot-reload`.
hot-reload = ["hamlet_assets/hot-reload"]

