[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
# The vendored fynix workspace is its own workspace, and a guest is built
# for wasm32-wasip2 in a workspace of its own.
exclude = ["vendor", "guests"]
# `cargo build`, `cargo test` and `cargo clippy` at the root cover every
# crate, so the checks in AGENTS.md need no flags.
default-members = [".", "crates/*", "plugins/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/hamlet"

[workspace.dependencies]
# hamlet
hamlet_sandbox = { version = "0.1.0", path = "crates/hamlet_sandbox" }
hamlet_model = { version = "0.1.0", path = "crates/hamlet_model" }
hamlet_home = { version = "0.1.0", path = "crates/hamlet_home" }
hamlet_rules = { version = "0.1.0", path = "crates/hamlet_rules" }
hamlet_core = { version = "0.1.0", path = "crates/hamlet_core" }
hamlet_desktop = { version = "0.1.0", path = "crates/hamlet_desktop" }
hamlet_assets = { version = "0.1.0", path = "crates/hamlet_assets" }
hamlet_vfx = { version = "0.1.0", path = "crates/hamlet_vfx" }
hamlet_realm = { version = "0.1.0", path = "crates/hamlet_realm" }
hamlet_sdk = { version = "0.1.0", path = "crates/hamlet_sdk" }
hamlet_chat = { version = "0.1.0", path = "crates/hamlet_chat" }
hamlet_ui = { version = "0.1.0", path = "crates/hamlet_ui" }
hamlet_testing = { version = "0.1.0", path = "crates/hamlet_testing" }
hamlet_wasm = { version = "0.1.0", path = "crates/hamlet_wasm" }
hamlet_openui = { version = "0.1.0", path = "crates/hamlet_openui" }
hamlet_guest = { version = "0.1.0", path = "crates/hamlet_guest" }
hamlet_offscreen = { version = "0.1.0", path = "crates/hamlet_offscreen" }
hamlet_harness = { version = "0.1.0", path = "crates/hamlet_harness" }
hamlet_plugins = { version = "0.1.0", path = "plugins/all" }
plugin_skills = { version = "0.1.0", path = "plugins/skills" }
plugin_needs = { version = "0.1.0", path = "plugins/needs" }

# fynix
bevy_fynix = { path = "vendor/fynix/crates/bevy_fynix" }

# openui-rs
openui-lang = { path = "vendor/openui-rs/crates/openui-lang" }

# bevy
bevy_app = { version = "0.19", default-features = false, features = ["std"] }
bevy_ecs = { version = "0.19", default-features = false, features = ["std"] }
# `system_clipboard` has copy and paste in a text box use the system's
# clipboard, not one inside the app.
bevy = { version = "0.19", default-features = false, features = ["2d", "3d", "ui", "mesh_picking", "default_platform", "system_clipboard", "bevy_audio", "bevy_dev_tools", "debug", "serialize"] }
bevy_hanabi = { version = "0.19", default-features = false, features = ["3d"] }

# other
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
interprocess = "2"
keyring = "4"
libc = "0.2"
# The text layout Bevy's text is built on, for selecting drawn words.
# Held to the version `bevy_text` uses, so its layouts are this crate's.
parley = { version = "0.9", default-features = false, features = ["std"] }
process-wrap = { version = "10.0.1", features = ["tokio1"] }
pulldown-cmark = { version = "0.13", default-features = false }
# The compact format the bytes between a host and a plugin are written in.
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
regex = "1"
rfd = "0.17"
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
objc2 = "0.5"
objc2-app-kit = { version = "0.2", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.2", default-features = false, features = ["std", "NSData"] }
winit = { version = "0.30", default-features = false }
toml = "1"
# The WASM engine, pinned to a stable release. Only `hamlet_wasm` names it.
wasmtime = { version = "=49.0.3", default-features = false, features = ["std", "runtime", "cranelift", "component-model", "pooling-allocator"] }

[workspace.lints.clippy]
redundant_type_annotations = "warn"
# Bevy systems take many parameters and long query types by nature.
too_many_arguments = "allow"
type_complexity = "allow"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[package]
name = "hamlet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The hamlet binary and the examples that draw the world and the panels"

[lints]
workspace = true

[dependencies]
# Named for the `hot-reload` feature; only the examples use it.
hamlet_assets.workspace = true
hamlet_sandbox.workspace = true
hamlet_model.workspace = true
hamlet_home.workspace = true
hamlet_core.workspace = true
hamlet_desktop.workspace = true
hamlet_ui.workspace = true
hamlet_realm.workspace = true
hamlet_sdk.workspace = true
hamlet_plugins.workspace = true
hamlet_wasm = { workspace = true, optional = true }
anyhow.workspace = true
bevy.workspace = true
bevy_app.workspace = true
tokio.workspace = true

[dev-dependencies]
hamlet_rules.workspace = true
hamlet_vfx.workspace = true
hamlet_openui.workspace = true
hamlet_offscreen.workspace = true
hamlet_harness.workspace = true
plugin_needs.workspace = true
bevy_fynix.workspace = true
serde_json.workspace = true

[features]
# Tests that reach a real model server or the internet. Off unless asked
# for: `cargo test --features live-tests`.
live-tests = ["hamlet_core/live-tests"]
# A saved change to a file under assets/ reaches the running app:
# `cargo run --features hot-reload`.
hot-reload = ["hamlet_assets/hot-reload"]
# Runs the installed WASM plugins: `cargo run --features wasm`.
wasm = ["dep:hamlet_wasm", "hamlet_harness/wasm"]

[[example]]
name = "style_test"

[[example]]
name = "town_gen"

[[example]]
name = "far_lands"

[[example]]
name = "ui_gallery"

[[example]]
name = "cursor_sheet"

[[example]]
name = "sound_sheet"

[[example]]
name = "chief_sheet"

[[example]]
name = "plugin_check"
required-features = ["wasm"]
