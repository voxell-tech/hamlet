[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"
description = "{{title}}, a plugin for Hamlet"

# Built for wasm32-wasip2 by build.sh, so it is a workspace of its own.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
hamlet_guest = { path = "{{hamlet}}/crates/hamlet_guest" }
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
