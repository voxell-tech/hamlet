# A plugin: a workspace of its own, built by its own `cargo` call.
[workspace]

[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["dylib"]

[dependencies]
# Named so that Bevy's derives find it. No features: the SDK's are the
# only ones, and one more would make a Bevy the app does not have.
bevy = { version = "=0.20.1", default-features = false }
hamlet_sdk = { path = "../sdk/hamlet_sdk" }
