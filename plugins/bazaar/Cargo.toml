[package]
name = "bazaar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Agent Bazaar: models from OpenRouter and the endpoints, skills from skills.sh, agents, tools and hamlets bought and sold at hamlet-server, and the looks agents and hamlets wear"
publish = false

[lib]
# The build is `target/wasm32-wasip2/release/bazaar.wasm`.
crate-type = ["cdylib"]

[dependencies]
hamlet_engine_bevy.workspace = true
agents_ui = { path = "../agents_ui" }
looks = { path = "../looks" }
serde.workspace = true
serde_json = "1"
