# The Agent Bazaar on its own. The harness sends no fetch and runs no
# agents service: OpenRouter is answered here with one model, skills.sh
# is left unanswered, and the bazaar's server too until the samples
# show. Without the realm, a hamlet's page says its town cannot be
# shown.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.bazaar --steps plugins/bazaar/steps.toml

[[step]]
allow = "hamlet.bazaar"

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Asking OpenRouter..." }

[[step]]
reply = { url = "https://openrouter.ai/api/v1/models?offset=0&limit=100", body = '{"data": [{"id": "maker/wick", "name": "Maker: Wick", "pricing": {"prompt": "0.000001", "completion": "0.000002"}, "supported_parameters": ["tools"]}]}' }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Wick" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "Wick" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "MAKE DEFAULT" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "SKILLS" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Asking skills.sh..." }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "AGENTS" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "PR Reviewer" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "PLUGINS" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Excalidraw Whiteboard" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "HAMLETS" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "Indie SaaS Launch Team" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "FOUND THIS HAMLET" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "The realm is not running, so its town cannot be shown." }

# The bazaar's server is not reached here: the stalls of what chiefs
# make say their listings are samples, and where the bazaar is asked.

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "AGENTS" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Samples, made up to show the stall" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "http://localhost:8787" }

# The seller's desk opens signed out, and says what the form lacks.

[[step]]
run = "hamlet.bazaar/sell"

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Sell an agent" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "The realm has no agents to sell." }

[[step]]
write = { panel = "hamlet.bazaar/bazaar", widget = "What it is called", text = "Wick" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "PUT UP FOR SALE" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Write a summary, a line of at most 140 letters." }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "TOOLS" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Sell tools" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "AGENTS" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "PR Reviewer" }

# The bazaar's server answers with a listing that has a cover: its
# shelf offers the sign-in at its foot. The cover is fetched as the
# listing's page opens, and one that is not a picture is not shown.

[[step]]
reply = { url = "http://localhost:8787/v1/listings?limit=100&offset=0", body = '{"items": [{"id": "l_1", "kind": "agent", "title": "Wick Lantern", "summary": "Keeps a light.", "category": "Writing", "priceCents": 0, "status": "listed", "seller": {"login": "maker"}, "coverUrl": "/v1/listings/l_1/cover?v=1"}], "total": 1}' }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Wick Lantern" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "With GitHub, to buy, and to sell what you made." }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "Wick Lantern" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "0 own it" }

[[step]]
reply = { url = "http://localhost:8787/v1/listings/l_1", body = '{"listing": {"id": "l_1", "kind": "agent", "title": "Wick Lantern", "summary": "Keeps a light.", "category": "Writing", "priceCents": 0, "status": "listed", "seller": {"login": "maker"}, "coverUrl": "/v1/listings/l_1/cover?v=1"}, "reviews": [], "owned": false}' }

[[step]]
reply = { url = "http://localhost:8787/v1/listings/l_1/cover?v=1", body = "not a picture" }

[[step]]
expect_log = "is not shown: It is not a PNG, JPEG or WebP that can be read."

# A cover is chosen at the desk by the address of a picture, fetched
# and checked before it is shown.

[[step]]
run = "hamlet.bazaar/sell"

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "there is none to choose" }

[[step]]
write = { panel = "hamlet.bazaar/bazaar", widget = "Address of a picture", text = "https://raw.githubusercontent.com/maker/wick/main/cover.gif" }

[[step]]
reply = { url = "https://raw.githubusercontent.com/maker/wick/main/cover.gif", body = "GIF89a" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "It is not a PNG, JPEG or WebP that can be read." }

# The Asset stall, its tab on the second line of tabs. The bazaar's
# server answers its catalogue, narrowed by the words searched for; an
# asset's page turns its pictures, and one that is not a picture is
# not shown. Signed out, nothing is bought, and the fitting has no one
# to dress. The closet tells the realm that nothing is worn.

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "LOOKS" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Asking the bazaar..." }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "With GitHub, to buy, and to wear what you bought." }

[[step]]
reply = { url = "http://localhost:8787/v1/assets", body = '{"items": [{"id": "agent-skin-sakura", "target": "agent", "category": "skin", "title": "Sakura", "summary": "Soft pinks for your agent.", "priceCents": 99, "version": "1.0.0", "frames": 24, "previewUrl": "/v1/assets/agent-skin-sakura/preview/{frame}?v=1.0.0", "owned": false}, {"id": "hamlet-emote-smoke", "target": "hamlet", "category": "emote", "title": "Hearth Smoke", "summary": "Smoke from every chimney.", "priceCents": 0, "version": "1.0.0", "frames": 0, "previewUrl": "", "owned": false}]}' }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "2 looks from the bazaar" }

[[step]]
write = { panel = "hamlet.bazaar/bazaar", widget = "Search looks", text = "smoke" }

[[step]]
lacks = { panel = "hamlet.bazaar/bazaar", text = "Sakura" }

[[step]]
write = { panel = "hamlet.bazaar/bazaar", widget = "Search looks", text = "pinks" }

[[step]]
lacks = { panel = "hamlet.bazaar/bazaar", text = "Hearth Smoke" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "Sakura" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Skin for agents, version 1.0.0" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "1 of 24" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Sign in with GitHub to get it." }

[[step]]
reply = { url = "http://localhost:8787/v1/assets/agent-skin-sakura/preview/0?v=1.0.0", body = "not a picture" }

[[step]]
expect_log = "agent-skin-sakura/preview/0?v=1.0.0 is not shown"

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "RIGHT" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "2 of 24" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "SPIN" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "STOP" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "LOOKS" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "1 look from the bazaar" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "FITTING" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "There are no agents or hamlets to dress yet." }

[[step]]
expect_asset = { type = "looks.worn", text = '"agents":{}' }

[[step]]
run = "hamlet.bazaar/looks"

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Soft pinks for your agent." }
