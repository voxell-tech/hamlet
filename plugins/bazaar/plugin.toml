id = "hamlet.bazaar"
name = "Agent Bazaar"
version = "0.1.0"
api = "0.1.0"

[[asks]]
capability = "net.fetch"
target = "openrouter.ai"
reason = "Lists the models OpenRouter offers, and who serves each, so you can add them"

[[asks]]
capability = "net.fetch"
target = "skills.sh"
reason = "Lists the skills skills.sh offers, searches it, and fetches a skill's files to show it and add it to the library"

[[asks]]
capability = "net.fetch"
target = "$HAMLET_BAZAAR_URL"
reason = "Signs you in with GitHub at the bazaar's server, shows what chiefs sell there, and buys, downloads and sells agents, hamlets and tools"

[[asks]]
capability = "agents.read"
target = "local"
reason = "Knows your endpoints, the models you have, the library's skills, your hamlets and what you bought, to show what is already yours, and the tools you could sell"

[[asks]]
capability = "agents.settings"
target = "local"
reason = "Adds the models you choose, makes one the default when you say so, and begins setting up OpenRouter"

[[asks]]
capability = "agents.chief"
target = "local"
reason = "Puts a skill you take into the library, founds a hamlet from a template you choose, writes what you buy into your realm, and packs what you sell"

[[asks]]
capability = "desktop.open"
target = "https"
reason = "Opens a skill's source or a link in it, GitHub's page to sign in, and Stripe's pages to pay and to be paid, in your browser"

[assets]
makes = [{ name = "bazaar.session", version = 1 }]

[env]
HAMLET_BAZAAR_URL = "http://localhost:8787"

[[asks]]
capability = "services.call"
target = "hamlet.realm/diorama"
reason = "Shows the town of a hamlet template on its page, as the realm builds it"

[[asks]]
capability = "render.scene"
target = "gpu"
reason = "Draws the town of a hamlet template turning on a plinth on its page"

# It asks the realm for the town of a template, a part at a time. The
# realm need not run: the page then says so.
[services]
imports = [{ service = "hamlet.realm/diorama", argument = "realm.diorama_ask", result = "realm.diorama_part" }]

[events]
sends = [{ name = "traded", payload = "bazaar.stall" }]
hears = [{ event = "hamlet.realm/stall", payload = "bazaar.stall" }]
