# The Realm with the Inspector it needs and the chat the Inspector
# needs: its panel is drawn, the Agent Bazaar is built beside the
# chief's Hearth with its six stalls, it wears no looks when none are
# made, and a click on the stall of AI models and on the costumier's
# is taken. The harness runs no agents service, so there are no
# hamlets. The Agent Bazaar's page of a hamlet template has the realm
# build the template's town, which it sets on a plinth in a scene of
# its own.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.realm --steps plugins/realm/steps.toml

with = [
    "../dist/hamlet.chat",
    "../dist/hamlet.inspector",
    "../dist/hamlet.bazaar",
]

[[step]]
allow = "hamlet.chat"

[[step]]
allow = "hamlet.inspector"

[[step]]
allow = "hamlet.realm"

[[step]]
allow = "hamlet.bazaar"

[[step]]
lacks = { panel = "hamlet.realm/realm", text = "cannot be drawn" }

[[step]]
expect_log = "the Agent Bazaar is built, with 6 stalls"

# No plugin here makes looks: the realm looks for what is worn, finds
# nothing and is drawn as ever.
[[step]]
expect_log = "looks: listing looks.worn: refused"

# The stall of AI models, `Thing::Stall(Stall::Models).key()`: it sends
# `hamlet.realm/stall`, which the bus would refuse with a warning were
# it not declared.
[[step]]
pick = { plugin = "hamlet.realm", key = 1879048192 }

# The costumier's, `Thing::Stall(Stall::Assets).key()`.
[[step]]
pick = { plugin = "hamlet.realm", key = 1879048197 }

[[step]]
frames = 30

[[step]]
lacks = { panel = "hamlet.realm/realm", text = "cannot be drawn" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "HAMLETS" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "Indie SaaS Launch Team" }

[[step]]
expect_log = "the diorama of saas-launch is built"

# The plinth's root, two lights, the camera, and a mesh for each look
# of each part: five looks, the realm's own.
[[step]]
expect_scene = { plugin = "hamlet.bazaar", entities = 27, meshes = 23, materials = 5, cameras = 1 }
