# The Realm with the Inspector it needs and the chat the Inspector
# needs: its panel is drawn, the Agent Bazaar is built beside the
# chief's Hearth, and a click on the stall of AI models is taken. The
# harness runs no agents service, so there are no hamlets.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.realm --steps plugins/realm/steps.toml

with = ["../dist/hamlet.chat", "../dist/hamlet.inspector"]

[[step]]
allow = "hamlet.chat"

[[step]]
allow = "hamlet.inspector"

[[step]]
allow = "hamlet.realm"

[[step]]
lacks = { panel = "hamlet.realm/realm", text = "cannot be drawn" }

[[step]]
expect_log = "the Agent Bazaar is built"

# The stall of AI models, `Thing::Stall(Stall::Models).key()`: it sends
# `hamlet.realm/stall`, which the bus would refuse with a warning were
# it not declared.
[[step]]
pick = { plugin = "hamlet.realm", key = 1879048192 }

[[step]]
frames = 30

[[step]]
lacks = { panel = "hamlet.realm/realm", text = "cannot be drawn" }
