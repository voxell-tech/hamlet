id = "hamlet.realm"
name = "Realm"
version = "0.1.0"
api = "0.1.0"

[[asks]]
capability = "agents.read"
target = "local"
reason = "Draws every hamlet, agent and road, and selects what you click"

[[asks]]
capability = "agents.chief"
target = "local"
reason = "Sets a hamlet down where you carry it"

[[asks]]
capability = "render.scene"
target = "gpu"
reason = "Draws the realm in its panel"

[[asks]]
capability = "render.shader"
target = "gpu"
reason = "Draws the roads' grooves and their light, and the rings and runes on the ground, with shaders of its own"

# It tells of a stall of the Agent Bazaar clicked, and shows a sale
# there when the bazaar says one was made.
[events]
sends = [{ name = "stall", payload = "bazaar.stall" }]
hears = [
    { event = "hamlet.inspector/carry", payload = "realm.carry" },
    { event = "hamlet.bazaar/traded", payload = "bazaar.stall" },
]

# It takes a town in hand as the Inspector carries it, and brings the
# Inspector forward on a click.
[dependencies]
"hamlet.inspector" = "^0.1"

# Its ground, hamlets and roads hold more memory than the engine gives a
# plugin, 128 MB in all.
[limits]
memory = 134_217_728
