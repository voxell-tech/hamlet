id = "hamlet.realm"
name = "Realm"
version = "0.1.0"
api = "0.1.0"

[[asks]]
capability = "agents.read"
target = "local"
reason = "Draws every hamlet, agent and road, and selects what you click"

[[asks]]
capability = "agents.chief"
target = "local"
reason = "Sets a hamlet down where you carry it"

[[asks]]
capability = "render.scene"
target = "gpu"
reason = "Draws the realm in its panel"

[[asks]]
capability = "render.shader"
target = "gpu"
reason = "Draws the roads' grooves and their light, and the rings and runes on the ground, with shaders of its own"

[[asks]]
capability = "audio.play"
target = "output"
reason = "Plays the realm's sounds: birds, crickets and wind, robots at work, houses rising and falling, and the calls for you"

# The sky chosen, kept between launches.
[assets]
makes = [{ name = "realm.view", version = 1 }]

[events]
hears = [{ event = "hamlet.agents/carry", payload = "realm.carry" }]

# It takes a town in hand as the Inspector carries it, and brings the
# Inspector forward on a click.
[dependencies]
"hamlet.agents" = "^0.1"
