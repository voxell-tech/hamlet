[package]
name = "hamlet_plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The one place that lists the plugins compiled into the app"

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
plugin_needs = { workspace = true, optional = true }
plugin_inspector = { workspace = true, optional = true }
plugin_settings = { workspace = true, optional = true }
plugin_skills = { workspace = true, optional = true }

[dev-dependencies]
bevy.workspace = true
hamlet_sdk.workspace = true

[features]
# A plugin is built in when the feature of its name is on.
default = ["inspector", "needs", "settings", "skills"]
inspector = ["dep:plugin_inspector"]
needs = ["dep:plugin_needs"]
settings = ["dep:plugin_settings"]
skills = ["dep:plugin_skills"]
