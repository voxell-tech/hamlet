[package]
name = "hamlet_plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The one place that lists the plugins compiled into the app"

[lints]
workspace = true

[dependencies]
bevy_app.workspace = true
plugin_needs = { workspace = true, optional = true }
plugin_skills = { workspace = true, optional = true }

[features]
# A plugin is built in when the feature of its name is on.
default = ["needs", "skills"]
needs = ["dep:plugin_needs"]
skills = ["dep:plugin_skills"]
