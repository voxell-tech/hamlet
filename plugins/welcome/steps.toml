# Welcome on its own: the card's steps, gone through and back. The
# harness runs no agents service, so no provider is listed and no
# setup moves on.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.welcome --steps plugins/welcome/steps.toml

[[step]]
allow = "hamlet.welcome"

[[step]]
expect = { panel = "hamlet.welcome/welcome", text = "WELCOME TO HAMLET" }

[[step]]
expect = { panel = "hamlet.welcome/welcome", text = "I'LL SET THIS UP LATER" }

[[step]]
click = { panel = "hamlet.welcome/welcome", widget = "I HAVE A KEY" }

[[step]]
expect = { panel = "hamlet.welcome/welcome", text = "WHO GIVES YOU YOUR MODEL" }

[[step]]
expect = { panel = "hamlet.welcome/welcome", text = "WHERE YOUR MODEL RUNS" }

[[step]]
click = { panel = "hamlet.welcome/welcome", widget = "BACK" }

[[step]]
click = { panel = "hamlet.welcome/welcome", widget = "I RUN MY OWN MODEL" }

[[step]]
expect = { panel = "hamlet.welcome/welcome", text = "Hamlet looks for Ollama on this computer, then LM Studio." }
