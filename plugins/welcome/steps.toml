# Welcome on its own: the card moves on to the next step. The harness
# runs no agents service, so no provider is listed and no setup moves
# on.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.welcome --steps plugins/welcome/steps.toml

[[step]]
allow = "hamlet.welcome"

[[step]]
click = { panel = "hamlet.welcome/welcome", widget = "I HAVE A KEY" }

[[step]]
expect = { panel = "hamlet.welcome/welcome", text = "WHO GIVES YOU YOUR MODEL" }
