# About on its own: its panel shows Hamlet's logo and the engine's
# version.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.about --steps plugins/about/steps.toml

[[step]]
allow = "hamlet.about"

[[step]]
expect = { panel = "hamlet.about/about", text = "Engine 0.1.0" }

[[step]]
expect = { panel = "hamlet.about/about", text = "picture 256x256" }
