id = "hamlet.inspector"
name = "Inspector"
version = "0.1.0"
api = "0.1.0"

[[asks]]
capability = "agents.read"
target = "local"
reason = "Shows the agents and hamlets, an agent's notes, character, prompt and past sessions, and selects what you pick"

[[asks]]
capability = "agents.chief"
target = "local"
reason = "Stops agents, chooses their models, opens a character to edit, resumes and deletes past sessions, and gives your commands to hamlets"

[[asks]]
capability = "agents.settings"
target = "local"
reason = "Changes a hamlet's bylaws: its budget, its models and what its mayor may do"

[[asks]]
capability = "desktop.open"
target = "https"
reason = "Opens a web link of an agent's notes or character in your browser when you click it"

[events]
sends = [{ name = "carry", payload = "realm.carry" }]
