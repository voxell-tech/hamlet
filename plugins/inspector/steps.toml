# The Inspector with the chat it needs: FOUND A HAMLET opens its form.
# The harness runs no agents service, so there are no hamlets.
#
# An agent's and a hamlet's page have CHANGE LOOKS, which sends `dress`
# to the Agent Bazaar. With no roster no such page shows here, so it is
# not pressed: the bazaar is only seen to start beside the Inspector,
# hearing the event the Inspector declares, and to show its LOOKS.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.inspector --steps plugins/inspector/steps.toml

with = ["../dist/hamlet.chat", "../dist/hamlet.bazaar"]

[[step]]
allow = "hamlet.chat"

[[step]]
allow = "hamlet.inspector"

[[step]]
click = { panel = "hamlet.inspector/inspector", widget = "FOUND A HAMLET" }

[[step]]
expect = { panel = "hamlet.inspector/found", text = "All three are needed." }

[[step]]
allow = "hamlet.bazaar"

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "Asking OpenRouter..." }

[[step]]
run = "hamlet.bazaar/looks"

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "FITTING" }

[[step]]
click = { panel = "hamlet.bazaar/bazaar", widget = "FITTING" }

[[step]]
expect = { panel = "hamlet.bazaar/bazaar", text = "There are no agents or hamlets to dress yet." }
