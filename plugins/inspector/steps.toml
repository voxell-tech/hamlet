# The Inspector with the chat it needs: FOUND A HAMLET opens its form.
# The harness runs no agents service, so there are no hamlets.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.inspector --steps plugins/inspector/steps.toml

with = ["../dist/hamlet.chat"]

[[step]]
allow = "hamlet.chat"

[[step]]
allow = "hamlet.inspector"

[[step]]
click = { panel = "hamlet.inspector/inspector", widget = "FOUND A HAMLET" }

[[step]]
expect = { panel = "hamlet.inspector/found", text = "All three are needed." }
