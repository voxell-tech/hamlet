# Scene Demo on its own, with no GPU: its panel is drawn, its scene
# holds the shapes and the field, and clicks on them are named.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.scene_demo --steps plugins/scene_demo/steps.toml

[[step]]
allow = "hamlet.scene_demo"

[[step]]
expect = { panel = "hamlet.scene_demo/scene", text = "Drag to turn" }

# The camera, the sun, the ground, the pool of light, three shapes
# and 400 cubes.
[[step]]
expect_scene = { plugin = "hamlet.scene_demo", entities = 407, cameras = 1, decals = 1 }

[[step]]
pick = { plugin = "hamlet.scene_demo", key = 11 }

[[step]]
expect = { panel = "hamlet.scene_demo/scene", text = "Clicked the sphere" }

[[step]]
pick = { plugin = "hamlet.scene_demo", key = 100, index = 7 }

[[step]]
expect = { panel = "hamlet.scene_demo/scene", text = "Clicked cube 7" }
