id = "hamlet.scene_demo"
name = "Scene Demo"
version = "0.1.0"
api = "0.1.0"

[[asks]]
capability = "render.scene"
target = "gpu"
reason = "Draws a lit scene of shapes and a field of cubes in its panel"

[[asks]]
capability = "render.shader"
target = "gpu"
reason = "Colours a ring and the field with shaders of its own, and darkens the view's edges"

[[asks]]
capability = "render.compute"
target = "gpu"
reason = "Moves the field of cubes in waves on the GPU"
