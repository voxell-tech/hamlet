# Settings on its own: its pages are drawn and a switch on one is
# turned. The harness runs no agents service, so nothing the agents
# would say shows.
#
#   scripts/build_plugins.sh
#   cargo run -p hamlet_engine_harness --bin plugin_check -- plugins/dist/hamlet.settings --steps plugins/settings/steps.toml

[[step]]
allow = "hamlet.settings"

[[step]]
expect = { panel = "hamlet.settings/endpoints", text = "ADD A PLACE FOR MODELS" }

# The switch is found by the words beside it.
[[step]]
toggle = { panel = "hamlet.settings/realm", widget = "Ballots hidden until it closes", on = true }
