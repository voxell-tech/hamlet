id = "hamlet.settings"
name = "Settings"
version = "0.1.0"
api = "0.1.0"

[[asks]]
capability = "agents.read"
target = "local"
reason = "Shows the agents' endpoints, models, settings, charter, the realm's limits and the lasting permissions"

[[asks]]
capability = "agents.settings"
target = "local"
reason = "Changes the default model, the models allowed and their prices, the agents' settings, the charter and the realm's limits, removes endpoints and sets up a place for models again"

[[asks]]
capability = "agents.chief"
target = "local"
reason = "Takes back a lasting permission when you choose Revoke"
