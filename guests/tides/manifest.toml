id = "tides"
name = "Tides"
version = "0.1.0"
interface = "0.1.0"

# It only answers what is sent to it, so it wants no ticks.
ticks = false

# The tool it gives the agents. The scope lists the hamlets whose
# agents are offered it; with none, every hamlet's are. A plugin that
# gives tools cannot also ask for chat.send, commands.run or
# plugin.use.
[[asks]]
capability = "agent.tool"
reason = "To give the agents of Home a tool that looks up the tide."
scope = ["Home"]
