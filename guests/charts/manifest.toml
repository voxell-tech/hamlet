id = "charts"
name = "Charts"
version = "0.1.0"
interface = "0.9.0"

# It only answers what is sent to it, so it wants no ticks.
ticks = false

# The canvas is the only drawing a plugin has: shapes in a box of its
# own panel. It is allowed when the chief lets the plugin in.
[[asks]]
capability = "ui.canvas"
reason = "To draw its chart of the week."
