# Run from the Hamlet checkout, after `guests/notes/build.sh <folder>`:
#   cargo run --example plugin_check --features wasm -- <folder> \
#     --script guests/notes/steps.toml --out <pictures>

[[step]]
tick = 1

[[step]]
expect = { panel = "main", text = "No notes yet" }

[[step]]
render = { panel = "main", file = "empty.png" }

# A note is made, and written in.
[[step]]
click = { panel = "main", node = "new" }

[[step]]
type = { panel = "main", node = "body", text = "Plan for the harbour\n\nMend the nets *today*, **not** later.\n\n- the quay\n- the nets\n\n```\nlet tide = 3;\n```" }

[[step]]
expect = { panel = "main", text = "Plan for the harbour" }

[[step]]
render = { panel = "main", file = "writing.png" }

# The same note, read as markdown.
[[step]]
toggle = { panel = "main", node = "preview" }

[[step]]
render = { panel = "main", file = "preview.png" }

# A second note, which is the newest and comes first.
[[step]]
click = { panel = "main", node = "new" }

[[step]]
type = { panel = "main", node = "body", text = "Shopping\nrope, tar" }

[[step]]
type = { panel = "main", node = "search", text = "harbour" }

[[step]]
render = { panel = "main", file = "search.png" }

[[step]]
type = { panel = "main", node = "search", text = "" }

# The agent's notes are asked for, and the chief allows it.
[[step]]
click = { panel = "main", node = "from-agent" }

[[step]]
expect = { panel = "main", text = "Waiting for you" }

[[step]]
set-papers = { notes = "Pears are grafted in March.\nThe press key is in the loft.", character = "A careful keeper.", skills = ["tidy"] }

[[step]]
grant = "read.papers"

[[step]]
expect = { panel = "main", text = "Pears are grafted in March." }

[[step]]
render = { panel = "main", file = "copied.png" }

# Delete asks twice.
[[step]]
click = { panel = "main", node = "delete" }

[[step]]
expect = { panel = "main", text = "Sure?" }

[[step]]
click = { panel = "main", node = "delete" }

[[step]]
expect = { panel = "main", text = "Select a note" }

# The chief allows the menu line and the shortcut, and uses both.
[[step]]
grant = "ui.menu"

[[step]]
grant = "ui.keys"

[[step]]
run-menu = "New note"

[[step]]
type = { panel = "main", node = "body", text = "From the menu" }

[[step]]
render = { panel = "main", file = "menu-note.png" }

[[step]]
press = "Cmd+Shift+N"

[[step]]
type = { panel = "main", node = "body", text = "From the keyboard" }

[[step]]
expect = { panel = "main", text = "From the menu" }

[[step]]
render = { panel = "main", file = "key-note.png" }

# A note that mentions an agent, and the tab of that agent: it lists
# the notes that mention it once the chief allows read.agents and
# ui.inspector.
[[step]]
press = "Cmd+Shift+N"

[[step]]
type = { panel = "main", node = "body", text = "Juniper grafts the pears\n\nEvery March, on the north rows." }

[[step]]
grant = "read.agents"

[[step]]
grant = "ui.inspector"

[[step]]
set-selected = "Juniper"

[[step]]
expect = { panel = "mentions", text = "Juniper grafts the pears" }

[[step]]
section = { title = "NOTES", file = "agent-tab.png" }

# The page in the Settings, with its checkbox turned on: a note then
# opens in preview.
[[step]]
grant = "ui.settings"

[[step]]
page = { title = "NOTES", file = "settings-page.png" }

[[step]]
toggle = { panel = "settings", node = "open-in-preview" }

[[step]]
page = { title = "NOTES", file = "settings-page-on.png" }

[[step]]
run-menu = "New note"

[[step]]
render = { panel = "main", file = "opens-in-preview.png" }
