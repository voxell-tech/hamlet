id = "notes"
name = "Notes"
version = "0.1.0"
interface = "0.7.0"

# What other plugins may run, hear of and read. The notes are the
# keys of its storage that start with `note.`.
[exports]
commands = ["add", "new"]
events = ["note-saved"]

[[exports.collections]]
name = "notes"
prefix = "note."

# The agent selected in the world, for its tab in the Inspector.
[imports]
events = ["host/selection-changed"]

[[asks]]
capability = "ui.menu"
reason = "To put New note in the HAMLET menu."

[[asks]]
capability = "ui.keys"
reason = "To start a new note with Cmd+Shift+N."

[[asks]]
capability = "read.papers"
reason = "To copy the selected agent's notes into a note of your own."

[[asks]]
capability = "read.agents"
reason = "To know which agent is selected, for its tab in the Inspector."

[[asks]]
capability = "ui.settings"
reason = "To put its page, NOTES, in the Settings."

[[asks]]
capability = "ui.inspector"
reason = "To put a NOTES tab in the Inspector's page of an agent."
