[package]
name = "hamlet_engine_core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What every engine module stands on: the tuning files, the home folder, the log and the budgets"

[lints]
workspace = true

[dependencies]
bevy.workspace = true
serde.workspace = true
toml.workspace = true

[features]
# A saved change to a file under engine/tuning/ reaches the running
# engine. Always so in a debug build; this asks for it in a release
# build too: `cargo run --release -p hamlet_engine --features hot-reload`.
hot-reload = []
