# The engine's sizes, timings and budgets. A time is in seconds unless
# its field says otherwise. What each value means is written beside its
# field, in the module that reads its section: [tuning] in
# engine/core/src/tuning.rs, [log] in log.rs, [budgets] in budget.rs,
# [limits] in engine/api/src/limits.rs, [sound] in
# engine/audio/src/settings.rs,
# [window] in engine/shell/src/window.rs, [workspaces] in workspace.rs,
# [interface_sounds] in sounds.rs,
# [wasm] in engine/wasm/src/host.rs, [render] in
# engine/render/src/viewport.rs, [harness] in
# engine/harness/src/lib.rs.

[tuning]
every = 0.5

[log]
keep = 500

