# The engine's sizes, timings and guards. A time is in seconds unless
# its field says otherwise. What each value means is written beside its
# field, in the module that reads its section: [tuning] in
# engine/core/src/tuning.rs, [log] in log.rs, [guards] in budget.rs,
# [limits] in engine/api/src/limits.rs, [sound] in
# engine/audio/src/settings.rs,
# [window] in engine/shell/src/window.rs, [workspaces] in workspace.rs,
# [interface_sounds] in sounds.rs,
# [wasm] in engine/wasm/src/host.rs, [render] in
# engine/render/src/viewport.rs, [harness] in
# engine/harness/src/lib.rs.

[tuning]
every = 0.5

[log]
keep = 500

# What keeps any plugin from crashing or freezing the engine. None of
# it holds a plugin back.
[guards]
node_depth = 32
hung = 10.0

# The value each limit of a plugin starts at when the person switches
# it on, on the plugin's page. No limit is on until they do.
[limits]
memory = 1_073_741_824
call_time = 1_000
cpu_time_per_second = 500
gpu_memory = 1_073_741_824
gpu_time_per_second = 500
scene_entities = 100_000
audio_memory = 268_435_456

[sound]
master = 0.6
interface = 0.35
world = 1.0
music = 0.4
voices = 0.5
reach = 14.0
ears = 6.0
save_after = 0.5

[interface_sounds]
most = 4
gap = 0.04
vary = 0.07
vary_tuned = 0.004
sway = 0.12
drag_quiet = 0.4

[window]
title = "Hamlet"
width = 1280
height = 800
least_width = 720
least_height = 480
hidden_wait = 0.5

[workspaces]
save_after = 0.5

[wasm]
tick = 5.0
wasm_bytes = 33_554_432
manifest_bytes = 16_384
watch = 1.0

[render]
viewport_least = 160.0
viewport_most = 8_192
click_slop = 4.0
wheel_line = 20.0
grow_levels = 8
timed_slots = 256

[harness]
patience = 1_000
pause = 1.0
