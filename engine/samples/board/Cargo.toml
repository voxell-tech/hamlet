[package]
name = "board"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A sample plugin: shows the notes plugin's note, live, with its count of words"
publish = false

# A workspace of its own, built for wasm32-wasip2:
# `cargo build --release --target wasm32-wasip2`.
[workspace]

[lib]
# The build is `target/wasm32-wasip2/release/plugin.wasm`.
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
hamlet_engine_sdk = { path = "../../sdk" }

[profile.release]
opt-level = "s"
strip = true
