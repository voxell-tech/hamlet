# The limits on the installed plugins' calls. What each value means is
# written beside its field in crates/hamlet_wasm/src/limits.rs.

[limits]
call_ms = 50
tick_ms = 5
memory_mib = 16
table_elements = 10000
log_lines = 32
log_bytes = 1024
panels = 8
tree_nodes = 400
tree_depth = 16
text_bytes = 4096
tree_text_bytes = 65536
events_per_second = 100
intents_per_call = 64
storage_bytes = 4194304
storage_keys = 512
storage_key_bytes = 64
storage_value_bytes = 262144
state_bytes = 65536
commands = 32
call_depth = 4
calls_in_flight = 8
call_frames = 300
call_bytes = 65536
collection_page_items = 32
collection_page_bytes = 65536

[reload]
poll_ms = 500
