# Tokyo Night's Day and Night styles, used as it uses them: panels on
# its sidebar colour, controls on its highlight, selection on its
# visual colour, and blue as the accent. Palette from tokyonight.nvim,
# Apache License 2.0.
# Each colour is "#rrggbbaa". What each one means is written beside
# its field of Palette in crates/hamlet_ui/src/theme.rs.
name = "Tokyo Night"

[light]
