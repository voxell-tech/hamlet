# Monokai Pro as Voxell wears it on voxell.dev: cyan for what is live
# and lit, purple beside it, and its own light variant. The dark
# panels sit on base1, with base0 under fields and code.
# Each colour is "#rrggbbaa". What each one means is written beside
# its field of Palette in crates/hamlet_ui/src/theme.rs.
