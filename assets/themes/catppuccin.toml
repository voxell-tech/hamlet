# Catppuccin's Latte and Mocha flavours, used as its style guide
# says: panes on Mantle and Crust, controls on Surface, Text for what
# is read, Subtext for labels, and Mauve, its ports' default, as the
# accent. Palette MIT licensed, copyright (c) 2021 Catppuccin.
# Each colour is "#rrggbbaa". What each one means is written beside
# its field of Palette in crates/hamlet_ui/src/theme.rs.
