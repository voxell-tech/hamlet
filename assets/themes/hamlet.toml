# Hamlet's own theme: fifteen colours for each variant, from which
# every role is derived in crates/hamlet_ui/src/theme/derive.rs.
# base0 to base8 run from the background end to the text end: in dark
# from the deepest background to the brightest text, in light from the
# lightest paper to the darkest ink. `accent` names the hue that is
# the brand colour, yellow unless it is set.
name = "Hamlet"

# The logo's night: its brown for panels, its cream and pale gold for
# words, its amber for the lamp.
[dark]
name = "Lamplight"
base0 = "#0f0905"
base1 = "#170f08"
base2 = "#2d1e12"
base3 = "#443120"
base4 = "#5f4c37"
base5 = "#8c7558"
base6 = "#b8a687"
base7 = "#d6c6a8"
base8 = "#fffce8"
red = "#ff7a66"
orange = "#ff8f48"
yellow = "#ffbe62"
green = "#acd48c"
blue = "#6fd6d2"
purple = "#c9a3d9"

# Lamplight by day: the logo's cream for cards, its brown for words,
# and its amber deepened until it reads on cream.
[light]
name = "Parchment"
base0 = "#fffce8"
base1 = "#f8f1d9"
base2 = "#f1e2ba"
base3 = "#e1d0a6"
base4 = "#c4ab7c"
base5 = "#8f6a2a"
base6 = "#6f5535"
base7 = "#4e3b28"
base8 = "#382516"
red = "#ff7a66"
orange = "#ff8f48"
yellow = "#ffbe62"
green = "#acd48c"
blue = "#6fd6d2"
purple = "#c9a3d9"
