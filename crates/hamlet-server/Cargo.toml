[package]
name = "hamlet-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The Rust Hamlet server: a claimed home, its realm database and the markers of operations"

[lib]
name = "hamlet_server"
path = "src/lib.rs"

[[bin]]
name = "hamlet-server"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hamlet_home.workspace = true
hamlet_protocol.workspace = true
anyhow.workspace = true
chrono.workspace = true
futures.workspace = true
interprocess.workspace = true
jsonschema = { version = "0.33", default-features = false }
ring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
url = "2"
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
hamlet_testing.workspace = true
libc.workspace = true
rusqlite.workspace = true
