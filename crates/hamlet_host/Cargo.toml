[package]
name = "hamlet_host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Runs actors in this process, each in one plain SQLite file"

[dependencies]
anyhow.workspace = true
hamlet_actor_core.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# Fault points a kill test stops the host at; see `fault`.
faults = []

[dev-dependencies]
# The crate's own tests and examples run with its fault points.
hamlet_host = { workspace = true, features = ["faults"] }
hamlet_testing.workspace = true

[lints]
workspace = true
