[package]
name = "hamlet_profiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The frame profiler's records: span times per frame on the main and render threads, and the GPU's time"

[lints]
workspace = true

[dependencies]
# `trace` gives every system, schedule and frame a span to record.
bevy = { workspace = true, features = ["bevy_log", "bevy_render", "trace"] }
tracing.workspace = true
wgpu = { workspace = true, features = ["wgsl"] }
