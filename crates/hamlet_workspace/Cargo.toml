[package]
name = "hamlet_workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Authenticated remote file and process execution for Hamlet"

[[bin]]
name = "hamlet-workspace"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
hamlet_workspace_wire.workspace = true
anyhow.workspace = true
base64.workspace = true
libc.workspace = true
reqwest.workspace = true
rustix = { version = "1", features = ["fs"] }
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
uuid.workspace = true
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots"] }
tonic-prost = "0.14"

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.2"
