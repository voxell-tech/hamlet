[package]
name = "hamlet_actors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Hamlet's actors on the actor host: the workspace, the realm, the profile and the library"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
ciborium.workspace = true
futures.workspace = true
hamlet_actor.workspace = true
hamlet_actor_core.workspace = true
hamlet_actor_error.workspace = true
hamlet_git.workspace = true
hamlet_host.workspace = true
hamlet_messages.workspace = true
hamlet_os.workspace = true
hamlet_protocol.workspace = true
hamlet_sandbox.workspace = true
hamlet_workspace_wire.workspace = true
jsonschema = { version = "0.33", default-features = false }
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
unicode-normalization = "0.1"
url.workspace = true
uuid.workspace = true

[features]
# A realm action that panics when `HAMLET_REALM_PANIC` names it.
faults = []
# The realm's step drives tell a test, through the host value
# `realm::StepsTold`, of each step a caller waits for and each drive's
# end.
steps-told = []

[dev-dependencies]
# The crate's own tests are told of the realm's steps.
hamlet_actors = { workspace = true, features = ["steps-told"] }
hamlet_protocol.workspace = true
hamlet_testing.workspace = true
image.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
