# The chief's limits for this hamlet (H22). Only you edit this file.
# It is read again before every model call and every mayor action, so
# a change applies at once. A section left out keeps its defaults. If
# the file cannot be read, nothing may be spent until it is fixed.

# Models this hamlet's mayor may choose for its agents, besides the
# model in the Connection settings, which is always allowed. A model
# here is run only if models.toml of the home allows it too. One
# served by another endpoint is written `endpoint::model`.
models = []

# The model an agent of this hamlet runs when nobody chose one for
# it. Left out, it is the default model of the home.
# model = "qwen3.6:35b-a3b"

most_agents = 12
# Roads the mayor has built. The road each agent has to the mayor is
# not counted.
most_roads = 24

# The hamlet's budget, in money: what its model calls may cost in a
# period. `period` is "day" or "month". Tokens are counted and
# shown, and never stop the work. `minutes` of model time may be
# capped too; left out, they are not.
[budget]
period = "day"
cost = 5.0
# minutes = 120

# The caps on one task, along every agent it touches: what it may
# cost, and how many messages may pass between agents.
[task]
messages = 12
cost = 1.0
# minutes = 30

# The price of a road, charged to the hamlet when the mayor builds one.
# A road nobody has used for `grows_over_days` is shown grown over. It
# still works.
[road]
cost = 0.01
grows_over_days = 7

# What the mayor may do without asking you first. Its agents are told
# what it decided over the last `told_days`, with its reasons.
[mayor]
create_agents = true
build_roads = true
remove_agents = true
merge_agents = true
told_days = 7

# Votes of a hamlet's agents. A vote passes with `pass` of them saying
# yes, as a fraction: [2, 3] is two thirds. It cannot be called with
# fewer than `least_voters` agents besides the mayor. `sealed` hides
# the ballots from the other voters until it closes. `grounded_only`
# counts a yes only when what it rests on is found in the voter's own
# notes or history. A voter has `ballot_minutes` to answer, a vote left
# open lapses after `open_minutes`, and an agent whose vote failed waits
# `retry_minutes` before calling another of its kind.
[votes]
pass = [2, 3]
least_voters = 3
sealed = true
grounded_only = false
ballot_minutes = 5
open_minutes = 60
retry_minutes = 60

# The hamlets of this home. `most` is how many there may be.
# `roads_between` says whether agents of different hamlets may have
# roads at all. It takes `removal_mayors` mayors of other hamlets to
# ask for a hamlet's removal, which still waits for you.
[hamlets]
most = 6
roads_between = true
removal_mayors = 3

# Agents leaving the hamlet. The mayor may not remove or merge an agent
# that has a task from you. An agent that objects holds its task open
# until you reply. `protected_minutes` adds time after the agent
# answers, if you want it to read the answer first. A merged agent's
# notes are rewritten by a model in at most `merged_notes` characters.
[leaving]
protected_minutes = 0
merged_notes = 6000

# What waits for you. `mayor_review` says when the mayor is asked about
# an instruction you give one of its agents, which costs a model call:
# "remote" only when the model is served from another machine, where
# the call runs beside the work; "always"; or "never". After
# `refusals` refusals in one turn an agent's further requests are
# refused without asking you. One turn may ask you `questions`
# questions.
[asking]
mayor_review = "remote"
refusals = 3
questions = 3

# Agents that may use the network, or run commands with no sandbox,
# without asking you each time, by name. Answering "always" to a
# request gives the same to one agent and is kept in grants.jsonl.
[permissions]
network = []
unconfined = []

# Your own choice of model for an agent. The mayor cannot change it.
[pinned]
# mayor = "qwen3.6:35b-a3b"
