[package]
name = "hamlet_app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Hamlet window, and examples that draw its world and panels"

[lib]
path = "src/lib.rs"

[[bin]]
name = "hamlet_app"
path = "src/main.rs"

# The process the web engine starts for the Web panels' pages.
[[bin]]
name = "hamlet_web_helper"
path = "src/web_helper.rs"
required-features = ["web"]

[lints]
workspace = true

[dependencies]
# Named for the `hot-reload` feature; only the examples use it.
hamlet_assets.workspace = true
hamlet_client.workspace = true
hamlet_desktop.workspace = true
hamlet_protocol.workspace = true
hamlet_ui.workspace = true
hamlet_realm.workspace = true
hamlet_vfx.workspace = true
hamlet_update = { workspace = true, features = ["check"] }
anyhow.workspace = true
# The product's Bevy: each library names only what its own code
# needs. `system_clipboard` has copy and paste in a text box use the
# system's clipboard, not one inside the app.
bevy = { workspace = true, features = ["2d", "3d", "ui", "mesh_picking", "default_platform", "system_clipboard", "bevy_audio", "bevy_dev_tools", "debug", "serialize", "bevy_clipboard", "bevy_winit", "custom_cursor"] }
bevy_app.workspace = true
bevy_fynix.workspace = true
chrono.workspace = true
image.workspace = true
parley.workspace = true
pulldown-cmark.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true

# The Web panels' Chromium (ADR 0014). `debug` reads CEF from where
# the window says rather than from inside an app bundle.
[target.'cfg(target_os = "macos")'.dependencies]
bevy_cef = { workspace = true, optional = true, features = ["debug"] }
bevy_cef_core = { workspace = true, optional = true, features = ["debug"] }
cef = { workspace = true, optional = true }
download-cef = { workspace = true, optional = true }

[dev-dependencies]
hamlet_testing.workspace = true

[features]
# A saved change to a file under assets/ reaches the running app:
# `cargo run -p hamlet_app --features hot-reload`.
hot-reload = ["hamlet_assets/hot-reload"]
# The Web panels, on macOS (ADR 0014). Building it needs CEF at
# `CEF_PATH`, and cmake and ninja on the path; running it, CEF at
# `CEF_PATH` or fetched by the window.
web = ["dep:bevy_cef", "dep:bevy_cef_core", "dep:cef", "dep:download-cef"]

[[example]]
name = "style_test"

[[example]]
name = "town_gen"

[[example]]
name = "far_lands"

[[example]]
name = "sea_bench"

[[example]]
name = "ui_gallery"

[[example]]
name = "cursor_sheet"

[[example]]
name = "sound_sheet"

[[example]]
name = "chief_sheet"
