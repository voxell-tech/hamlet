[package]
name = "hamlet_assets"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The files under assets/, embedded in the app and loaded as Bevy assets"

[lints]
workspace = true

# Bevy's parts, not the whole: the files load without a renderer.
[dependencies]
bevy_app.workspace = true
bevy_asset.workspace = true
bevy_color.workspace = true
bevy_ecs.workspace = true
bevy_log.workspace = true
bevy_math.workspace = true
bevy_reflect.workspace = true
serde.workspace = true
toml.workspace = true

[features]
# Watches the files under assets/ and reads a saved change again.
hot-reload = ["bevy_asset/embedded_watcher"]
