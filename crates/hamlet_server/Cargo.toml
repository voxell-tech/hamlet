[package]
name = "hamlet_server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Hamlet server: the realm, its society, and the agents' conversations and work"

[[bin]]
name = "hamlet_server"
path = "src/main.rs"

[lints]
workspace = true

# For tests only, never for a release build.
[features]
# Compiles the front door's tests, which start the actors' Node host
# and need `npm ci --prefix hosts/node` and the native module that
# `cargo xtask node` builds.
node-host = []

[dependencies]
hamlet_actor.workspace = true
hamlet_actor_error.workspace = true
hamlet_actors.workspace = true
hamlet_git.workspace = true
hamlet_host.workspace = true
hamlet_messages.workspace = true
hamlet_os.workspace = true
hamlet_protocol.workspace = true
hamlet_sandbox.workspace = true
hamlet_workspace_wire.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
ciborium.workspace = true
futures.workspace = true
interprocess.workspace = true
jsonschema = { version = "0.33", default-features = false }
reqwest.workspace = true
ring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
hamlet_testing.workspace = true
diesel.workspace = true
image.workspace = true

# Its fixtures stop servers with Unix signals.
[target.'cfg(unix)'.dev-dependencies]
hamlet_acceptance.workspace = true

[[test]]
name = "front"
path = "tests/front/main.rs"
required-features = ["node-host"]
