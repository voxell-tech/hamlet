[package]
name = "hamlet_server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Hamlet server: the realm, its society, and the agents' conversations and work"

[[bin]]
name = "hamlet_server"
