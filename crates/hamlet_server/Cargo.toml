[package]
name = "hamlet_server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Hamlet server: the realm, its society, and the agents' conversations and work"

[[bin]]
name = "hamlet_server"
path = "src/main.rs"

[lints]
workspace = true

# For tests only, never for a release build.
[features]
# Points where a test stops the server, to kill it there.
faults = []
# Compiles the tests that start the pi harness, which need Node and
# `npm ci --prefix harnesses/pi`.
harness = ["faults"]

[dependencies]
hamlet_git.workspace = true
hamlet_os.workspace = true
hamlet_protocol.workspace = true
hamlet_sandbox.workspace = true
hamlet_store.workspace = true
hamlet_workspace_wire.workspace = true
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
diesel.workspace = true
futures.workspace = true
interprocess.workspace = true
jsonschema = { version = "0.33", default-features = false }
regex.workspace = true
reqwest.workspace = true
ring.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
unicode-normalization = "0.1"
url.workspace = true
uuid.workspace = true

[dev-dependencies]
hamlet_testing.workspace = true

# Its fixtures stop servers with Unix signals.
[target.'cfg(unix)'.dev-dependencies]
hamlet_acceptance.workspace = true

[[test]]
name = "crashes"
path = "tests/crashes/main.rs"
required-features = ["harness"]
