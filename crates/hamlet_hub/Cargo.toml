[package]
name = "hamlet_hub"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "The Hub: the chat with agents, the realm's overview and the pages a Hub shows, and the menu over the world's things"

[lints]
workspace = true

[dependencies]
hamlet_core.workspace = true
bevy = { workspace = true, features = ["bevy_asset", "bevy_camera", "bevy_clipboard", "bevy_input_focus", "bevy_log", "bevy_picking", "bevy_text", "bevy_ui", "bevy_ui_widgets", "bevy_window"] }
image.workspace = true
jiff.workspace = true
parley.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
hamlet_core = { workspace = true, features = ["testing"] }

[features]
# The helpers of the tests of the Hub and of the window, for their
# crates' dev-dependencies.
testing = ["hamlet_core/testing"]
