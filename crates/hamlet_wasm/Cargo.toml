[package]
name = "hamlet_wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The host of the installed plugins: WASM components run under limits, one store each"

[lints]
workspace = true

[dependencies]
hamlet_agents_api.workspace = true
hamlet_assets.workspace = true
hamlet_base.workspace = true
hamlet_desktop.workspace = true
hamlet_openui.workspace = true
hamlet_realm_api.workspace = true
hamlet_sdk.workspace = true
bevy.workspace = true
postcard.workspace = true
bevy_fynix.workspace = true
futures.workspace = true
naga.workspace = true
reqwest.workspace = true
serde.workspace = true
sha2.workspace = true
tokio.workspace = true
toml.workspace = true
wasmtime.workspace = true
# The test plugins of the `fixture` feature.
wat = { version = "1.262", optional = true }
wit-component = { version = "0.262", optional = true }
wit-parser = { version = "0.262", optional = true }

[features]
# Makes the test plugins of `fixture` public, for a crate that tests
# its own code against the host.
fixture = ["dep:wat", "dep:wit-component", "dep:wit-parser"]

[[example]]
name = "bench"

[dev-dependencies]
hamlet_home.workspace = true
# The test plugins are core modules in text, made into components
# against the WIT file.
wat = "1.262"
wit-component = "0.262"
wit-parser = "0.262"
