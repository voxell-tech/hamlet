[package]
name = "hamlet_acceptance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "A black-box acceptance suite for Hamlet's server, driven through the client protocol"

[lints]
workspace = true

[features]
# Compiles real-process scenarios, which need the CLI, server
# and Node with `npm ci --prefix harnesses/pi`.
acceptance = []

[dependencies]
base64.workspace = true
futures.workspace = true
hamlet_protocol.workspace = true
hamlet_testing.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
uuid.workspace = true

[[test]]
name = "mayor"
required-features = ["acceptance"]

[[test]]
name = "documents"
required-features = ["acceptance"]

[[test]]
name = "models"
required-features = ["acceptance"]

[[test]]
name = "gifts"
required-features = ["acceptance"]

[[test]]
name = "society"
required-features = ["acceptance"]

[[test]]
name = "realm"
required-features = ["acceptance"]

[[test]]
name = "connection"
required-features = ["acceptance"]

[[test]]
name = "cli"
required-features = ["acceptance"]

[[test]]
name = "sandbox"
required-features = ["acceptance"]

[[test]]
name = "frames"
required-features = ["acceptance"]
