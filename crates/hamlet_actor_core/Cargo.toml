# This file was changed for Hamlet. See NOTICE in this crate.
[package]
name = "hamlet_actor_core"
version.workspace = true
license = "Apache-2.0"
repository.workspace = true
edition.workspace = true
autotests = false
description = "Core runtime primitives for actor hosts"

[features]
default = ["native-runtime"]
native-runtime = [
	"dep:opentelemetry-otlp",
	"dep:tracing-subscriber",
]
wasm-runtime = []
sqlite-remote = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
ciborium.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true
futures.workspace = true
http.workspace = true
parking_lot.workspace = true
opentelemetry = { version = "0.28", default-features = false, features = [
	"trace",
	"internal-logs",
] }
opentelemetry-otlp = { version = "0.28", default-features = false, optional = true, features = ["trace", "http-json", "http-proto", "grpc-tonic", "reqwest-blocking-client"] }
opentelemetry_sdk = { version = "0.28", default-features = false, features = ["trace", "internal-logs"] }
rand.workspace = true
hamlet_actor_error.workspace = true
hamlet_actor_wire.workspace = true
lazy_static.workspace = true
# The process collector exports this process's RSS, CPU and file descriptors on Linux.
prometheus = { workspace = true, features = ["process"] }
scc.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bare.workspace = true
subtle.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-opentelemetry = { version = "0.29", default-features = false }
tracing-subscriber = { workspace = true, optional = true }
vbare = { workspace = true, features = ["serde"] }

[dev-dependencies]
# The examples run on the local host, which builds on this crate.
hamlet_host.workspace = true
# The tests' host serves SQL from an in-memory database.
rusqlite.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `block_in_place` in the queue's sync bridge needs the multi-thread runtime, which the
# workspace tokio does not enable.
tokio = { workspace = true, features = ["rt-multi-thread"] }
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
tokio = { version = "1.44.0", default-features = false, features = ["macros", "rt", "sync", "time"] }
uuid = { version = "1.11.0", features = ["v4", "serde", "js"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-time = "1.1"

[lints]
workspace = true
