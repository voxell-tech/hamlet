[package]
name = "hamlet_core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "What every part of the Hamlet window is built on: Bevy, the widget kit, the client and the ways in"

[lints]
workspace = true

[dependencies]
hamlet_assets.workspace = true
hamlet_client.workspace = true
hamlet_desktop.workspace = true
hamlet_protocol.workspace = true
hamlet_ui.workspace = true
bevy = { workspace = true, features = ["bevy_input_focus", "bevy_picking", "bevy_ui"] }
bevy_fynix.workspace = true
jiff.workspace = true
reqwest.workspace = true
hamlet_testing = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
hamlet_testing.workspace = true
serde_json.workspace = true

[features]
# The helpers of the tests of the window's parts, for their crates'
# dev-dependencies.
testing = ["dep:hamlet_testing", "dep:serde_json"]
