[package]
name = "hamlet_update"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Hamlet updating itself from its releases: finding a newer one, downloading and checking it, and putting it in place"

[lints]
workspace = true

[dependencies]
hamlet_protocol.workspace = true
anyhow.workspace = true
base64 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
# Finding and downloading an update, which only the window does; the
# launcher, which puts one in place, goes without the network.
check = ["dep:base64", "dep:reqwest", "dep:ring", "dep:serde", "dep:serde_json", "dep:sha2", "dep:tokio"]
