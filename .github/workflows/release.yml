# Complete installations for macOS/Linux and the Windows remote-client window.
#
# Runs when a version tag is pushed (v0.1.0) and when started by hand
# from the Actions tab, and at no other time. A tag publishes a GitHub
# release with the three archives. A run by hand only keeps them as
# the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: aarch64-apple-darwin
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows (x64, window only)
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive

      # A tag publishes the version Cargo.toml names, and no other.
      - name: Check the tag is the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -eu
          version=$(sed -n '/^version = "/{s/^version = "\([^"]*\)".*/\1/p;q;}' Cargo.toml)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME is not v$version, the version in Cargo.toml." >&2
            exit 1
          fi

      # The stable toolchain rust-toolchain.toml names.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "${{ matrix.target }}"

      - uses: actions/setup-node@v4
        if: runner.os != 'Windows'
        with:
          node-version-file: harnesses/pi/.nvmrc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install what Bevy links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev

      - name: Build
        if: runner.os != 'Windows'
        run: cargo xtask build --target ${{ matrix.target }}

      - name: Build the Windows window
        if: runner.os == 'Windows'
        run: cargo build --release --locked -p hamlet_app --bin hamlet_app --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: .github/scripts/package.sh "${{ matrix.target }}" "${{ github.ref_type == 'tag' && github.ref_name || github.sha }}"

      - uses: actions/upload-artifact@v4
        with:
          name: hamlet-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A release made by hand before the tag was built is added to,
      # and a file it already holds is replaced.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --title "Hamlet $TAG" \
              --generate-notes
          fi
