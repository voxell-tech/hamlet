# Complete installations for macOS, Linux and Windows: an archive for
# each, and what a chief installs without a terminal, a disk image, an
# installer, a .deb and an .rpm.
#
# Runs when a version tag is pushed, every hour, and when started by
# hand from the Actions tab. Each feeds a channel installed copies
# update from (docs/releases.md#updates):
#
# - v0.2.0 publishes a stable release, the latest on GitHub.
# - v0.2.0-beta.1 publishes a beta: a pre-release, whose manifest is
#   also put on the release `beta`.
# - Any other suffix, as v0.1.0-dev.1, publishes a pre-release that no
#   channel offers.
# - The hourly run publishes a nightly to the release `nightly`,
#   replacing the last one's files, when main has a newer commit that
#   passed CI and the last nightly is NIGHTLY_HOURS old.
# - A run by hand with `stable` releases the nightly's commit as
#   Cargo.toml's version, so stable ships what nightly copies ran.
# - A run by hand without it only keeps its files as the run's
#   artifacts.
#
# Signing waits on the repository's secrets, and is skipped without
# them. macOS: APPLE_CERTIFICATE (a Developer ID Application .p12, in
# base64), APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY sign;
# APPLE_ID, APPLE_TEAM_ID and APPLE_APP_PASSWORD (an app-specific
# password) then notarize. Windows, through Azure Trusted Signing:
# AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
# TRUSTED_SIGNING_ENDPOINT, TRUSTED_SIGNING_ACCOUNT and
# TRUSTED_SIGNING_PROFILE.
#
# Updates wait on a key pair (docs/releases.md#updates): the variable
# HAMLET_UPDATE_KEY, the public key in base64, is built into a
# published build's programs, and the secret HAMLET_UPDATE_SIGNING_KEY,
# the private key in PEM, signs the release's latest.json. Without them
# a release neither looks for updates nor offers one.
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    # Away from minute zero, when GitHub's scheduled runs are busiest.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      stable:
        description: Release the nightly's commit as stable
        type: boolean
        default: false

permissions:
  contents: read

# Nightlies run one at a time, so they publish in order. No running run
# is cancelled: a nightly or a release stopped halfway leaves its
# release with some of its files. A waiting run gives way to a newer
# one of its group, which only drops a nightly or a run by hand that
# publishes nothing: a stable release by hand has a group of its own.
concurrency:
  group: >-
    release-${{ github.event_name == 'schedule' && 'nightly' ||
    inputs.stable && 'stable' || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # The least time between two nightlies, so nightly copies are not
  # offered an update for every merge.
  NIGHTLY_HOURS: 6

jobs:
  # Whether the run builds, and what: the commit, its version, the
  # channel its programs follow and the release it publishes to, none
  # for a run by hand without `stable`.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To read CI's runs.
      actions: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      semver: ${{ steps.plan.outputs.semver }}
      channel: ${{ steps.plan.outputs.channel }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      # A nightly builds main's newest commit to pass CI on a push, once
      # it is newer than the last nightly's and that one is old enough.
      # A stable release builds the last nightly's commit.
      - name: Choose the commit
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          STABLE: ${{ inputs.stable }}
        run: |
          set -euo pipefail
          skip() {
            echo "$1"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if ! nightly=$(gh api "repos/$REPO/git/ref/tags/nightly" --jq .object.sha 2>/dev/null); then
            nightly=
          fi
          if [ "$EVENT" = schedule ]; then
            sha=$(gh api "repos/$REPO/actions/workflows/rust.yml/runs?branch=main&event=push&status=success&per_page=1" \
              --jq '.workflow_runs[0].head_sha // empty')
            [ -n "$sha" ] || skip "No commit on main has passed CI."
            if [ -n "$nightly" ]; then
              case $(gh api "repos/$REPO/compare/$nightly...$sha" --jq .status) in
                ahead) ;;
                identical) skip "The nightly is main's newest commit to pass CI." ;;
                *) skip "::warning::$sha is not after the nightly's commit $nightly." ;;
              esac
              last=$(gh release view nightly --repo "$REPO" --json assets \
                --jq '[.assets[].updatedAt] | max // empty')
              if [ -n "$last" ] &&
                (( $(date -u +%s) - $(date -u -d "$last" +%s) < NIGHTLY_HOURS * 3600 )); then
                skip "The last nightly is under $NIGHTLY_HOURS hours old."
              fi
            fi
          elif [ "$STABLE" = true ]; then
            if [ -z "$nightly" ]; then
              echo "::error::There is no nightly to release."
              exit 1
            fi
            sha=$nightly
          else
            sha=$GITHUB_SHA
          fi
          {
            echo "sha=$sha"
            echo "build=true"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.commit.outputs.build == 'true'
        with:
          persist-credentials: false
          ref: ${{ steps.commit.outputs.sha }}

      - name: Plan
        id: plan
        if: steps.commit.outputs.build == 'true'
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          STABLE: ${{ inputs.stable }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          sha=$(git rev-parse HEAD)
          cargo_version=$(sed -n '/^version = "/{s/^version = "\([^"]*\)".*/\1/p;q;}' Cargo.toml)
          released() {
            git ls-remote --exit-code --tags origin "refs/tags/v$cargo_version" >/dev/null
          }
          channel=
          if [ "$EVENT" = schedule ]; then
            # A nightly of a released version would sort below the
            # release, so no nightly copy would take it.
            if released; then
              echo "::warning::v$cargo_version is released: raise the version in Cargo.toml for the next nightly."
              echo "build=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # The day in UTC and the run's number, which only grow, so
            # semver orders nightlies as they were published.
            version=v$cargo_version-nightly.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER
            channel=nightly
            release=nightly
          elif [ "$STABLE" = true ]; then
            if released; then
              echo "::error::v$cargo_version is already released."
              exit 1
            fi
            version=v$cargo_version
            channel=stable
            release=$version
          elif [ "$REF_TYPE" = tag ]; then
            version=$TAG
            release=$TAG
            case $TAG in
              *-beta.*) channel=beta ;;
              *-*) ;;
              *) channel=stable ;;
            esac
          else
            version=$sha
            release=
          fi
          # The programs parse a published version as semver.
          number='(0|[1-9][0-9]*)'
          word='(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)'
          semver="^$number\.$number\.$number(-$word(\.$word)*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$"
          if [ -n "$release" ] && [[ ! ${version#v} =~ $semver ]]; then
            echo "::error::${version#v} is not a semver version."
            exit 1
          fi
          {
            echo "build=true"
            echo "sha=$sha"
            echo "version=$version"
            echo "semver=${version#v}"
            echo "channel=$channel"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      TARGET: ${{ matrix.target }}
      # Only a published build looks for updates; a run by hand is a
      # test. Its version, pre-release and all, and its channel are
      # built in.
      HAMLET_UPDATE_KEY: ${{ needs.plan.outputs.release != '' && vars.HAMLET_UPDATE_KEY || '' }}
      HAMLET_CHANNEL: ${{ needs.plan.outputs.channel }}
      HAMLET_VERSION: ${{ needs.plan.outputs.release != '' && needs.plan.outputs.semver || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
          - name: Linux (x64)
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: Windows (x64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # The C runtime is linked in, so the binaries run on a
            # Windows that lacks the Visual C++ runtime.
            rustflags: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}
          # vendor/fynix is a submodule.
          submodules: recursive

      # A tag publishes the version Cargo.toml names, and no other:
      # v0.1.0, or a pre-release of it such as v0.1.0-dev.1.
      - name: Check the tag is the version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -eu
          version=$(sed -n '/^version = "/{s/^version = "\([^"]*\)".*/\1/p;q;}' Cargo.toml)
          tag=${GITHUB_REF_NAME#v}
          if [ "$tag" != "$version" ] && [[ $tag != "$version"-* ]]; then
            echo "The tag $GITHUB_REF_NAME is not v$version, the version in Cargo.toml, or a pre-release of it." >&2
            exit 1
          fi

      # The stable toolchain rust-toolchain.toml names.
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - uses: actions/setup-node@v4
        with:
          node-version-file: harnesses/pi/.nvmrc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install what Bevy links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev rpm

      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if ! command -v iscc && [ ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --no-progress -y
          fi

      - name: Build
        if: runner.os != 'Windows'
        run: cargo xtask build --target "$TARGET"

      - name: Build on Windows
        if: runner.os == 'Windows'
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        shell: bash
        run: cargo build --release --locked -p hamlet_cli --bin hamlet --bin hamlet_launch -p hamlet_server --bin hamlet_server -p hamlet_app --bin hamlet_app --target "$TARGET"

      - name: Sign the programs on Windows
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: target/${{ matrix.target }}/release
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # A keychain of this run's own, holding the Developer ID.
      - name: Import the Developer ID on macOS
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain=$RUNNER_TEMP/signing.keychain-db
          password=$(uuidgen)
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"

      - name: Package
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && env.APPLE_CERTIFICATE != '' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: .github/scripts/package.sh "$TARGET" "$VERSION"

      - name: Sign the installer on Windows
        if: runner.os == 'Windows' && env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
          files-folder: dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: hamlet-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    if: needs.plan.outputs.release != ''
    needs: [plan, build]
    runs-on: ubuntu-latest
    # One release publishes at a time, whatever its tag, so two cannot
    # both read the same latest release and each make itself latest.
    # Every waiting one is kept.
    concurrency:
      group: release-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ needs.plan.outputs.sha }}
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      RELEASE: ${{ needs.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # A release made by hand before the tag was built is added to,
      # and a file it already holds is replaced. A tag with a suffix,
      # such as v0.1.0-beta.1, is a pre-release, which is never the
      # latest release stable copies update to, however it was made. A
      # stable release is the latest unless a newer one is, as when an
      # older release is published again. A stable release of the
      # nightly's commit makes its tag there.
      - name: Publish the release
        if: needs.plan.outputs.channel != 'nightly'
        env:
          TAG: ${{ needs.plan.outputs.release }}
        run: |
          # No latest release yet is a 404; any other failure stops the
          # run rather than take the release for the first.
          if ! latest=$(gh api "repos/$REPO/releases/latest" --jq .tag_name 2>latest.err); then
            if ! grep -q 'HTTP 404' latest.err; then
              cat latest.err >&2
              exit 1
            fi
            latest=
          fi
          if [[ $TAG == *-* ]]; then
            kind=(--prerelease --latest=false)
          elif [ -n "$latest" ] && [ "$latest" != "$TAG" ] &&
            [ "$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -n 1)" = "$latest" ]; then
            echo "::warning::$latest is newer, so it stays the latest release."
            kind=(--prerelease=false --latest=false)
          else
            kind=(--prerelease=false --latest)
          fi
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
            gh release edit "$TAG" --repo "$REPO" "${kind[@]}"
          else
            gh release create "$TAG" dist/* \
              --repo "$REPO" \
              --target "$SHA" \
              --title "Hamlet $TAG" \
              --generate-notes \
              "${kind[@]}"
          fi

      # The release `nightly` holds the newest nightly's files, its tag
      # moved to the commit they were built from.
      - name: Publish the nightly
        if: needs.plan.outputs.channel == 'nightly'
        run: |
          .github/scripts/channel.sh nightly "$SHA" "Hamlet Nightly" "$REPO"
          gh release upload nightly dist/* --repo "$REPO" --clobber
          gh release edit nightly --repo "$REPO" \
            --notes "Hamlet $VERSION, built from $SHA."

      # Last, so an installed Hamlet finds the update only once every
      # file it names is there. A beta's manifest is also put on the
      # release `beta`, where beta copies look for it.
      - name: Publish the update manifest
        if: needs.plan.outputs.channel != ''
        env:
          HAMLET_UPDATE_SIGNING_KEY: ${{ secrets.HAMLET_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$HAMLET_UPDATE_SIGNING_KEY" ]; then
            echo "No HAMLET_UPDATE_SIGNING_KEY: the release offers no update."
            exit 0
          fi
          .github/scripts/manifest.sh "$VERSION" "$REPO" "$RELEASE"
          gh release upload "$RELEASE" dist/latest.json dist/latest.json.sig \
            --repo "$REPO" --clobber
          if [ "$CHANNEL" = beta ]; then
            .github/scripts/channel.sh beta "$SHA" "Hamlet Beta" "$REPO"
            gh release upload beta dist/latest.json dist/latest.json.sig \
              --repo "$REPO" --clobber
          fi

      # After the manifest, so a copy that read the last one can still
      # download what it named.
      - name: Remove the last nightly's files
        if: needs.plan.outputs.channel == 'nightly'
        run: |
          gh release view nightly --repo "$REPO" --json assets \
            --jq '.assets[].name' |
            while IFS= read -r name; do
              if [ ! -e "dist/$name" ]; then
                gh release delete-asset nightly "$name" --repo "$REPO" --yes
              fi
            done
