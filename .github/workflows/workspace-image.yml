# Builds the remote workspace image, without pushing it, whenever what
# goes into it changes. Deploying stays a manual step: see
# crates/hamlet_workspace/README.md.
name: Workspace image

on:
  pull_request:
    paths:
      - crates/hamlet_workspace/**
      - crates/hamlet_workspace_wire/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - .dockerignore
      - .github/workflows/workspace-image.yml
  push:
    branches:
      - main
    paths:
      - crates/hamlet_workspace/**
      - crates/hamlet_workspace_wire/**
      - Cargo.toml
      - Cargo.lock
      - Makefile
      - .dockerignore
      - .github/workflows/workspace-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - run: make workspace-image WORKSPACE_IMAGE=hamlet-workspace:ci
      # Without a role the binary prints its usage and fails, which
      # shows it starts on the image's runtime.
      - run: |
          if output=$(docker run --rm hamlet-workspace:ci 2>&1); then
            echo "Expected the usage error, got success" >&2
            exit 1
          fi
          echo "$output"
          grep -q 'usage: hamlet-workspace' <<< "$output"
