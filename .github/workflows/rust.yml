name: CI
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
# Each run on main is a group of its own, so none is cancelled or kept
# waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

# No debug info and no incremental build: with them the runner has too
# little room to link every test and example, and the linker is killed.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0
  # The crates test-windows tests, in its two test steps. test-changed
  # tests on Windows only those of them a pull request changes.
  WINDOWS_SERVER_TESTS: -p hamlet_os -p hamlet_server
  WINDOWS_HOST_TESTS: -p hamlet_host -p hamlet_actor_core -p hamlet_actor -p hamlet_actor_client -p hamlet_actor_wire -p hamlet_actor_error -p hamlet_actor_error_macros

# Stable is the toolchain rust-toolchain.toml names, which a bare
# `rustup toolchain install` installs. Formatting uses the latest
# nightly. The full Linux and macOS jobs run `cargo xtask`
# steps by name, which pass --locked to cargo since GitHub sets CI.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - run: rustup toolchain install nightly --profile minimal --component rustfmt
      - run: cargo xtask format

  clippy-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo xtask clippy
      - run: cargo xtask cross
      # The server and the CLI compile C, so their cross-check needs
      # mingw-w64.
      - run: sudo apt-get install --no-install-recommends gcc-mingw-w64-x86-64
      - run: cargo clippy --locked -p hamlet_server -p hamlet_cli --all-targets --target x86_64-pc-windows-gnu -- -D warnings

  # The clippy job on macOS, which compiles the code only macOS builds.
  clippy-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      # The image's stable can lag the rust-version, and install reuses it.
      - run: rustup update stable
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask clippy

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      # Prebuilt, at the version the check was set up on.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2
      - run: cargo xtask deny

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo xtask doc

  # Faux and loopback providers only. `cargo xtask test` runs the doc
  # tests too.
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: harnesses/pi/.nvmrc
      # Ubuntu 24.04 blocks bubblewrap's unprivileged user namespaces.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev bubblewrap
      - run: cargo xtask test
      - run: cargo xtask acceptance
      - run: cargo xtask harness
      - run: cargo xtask node

  # The test job's steps on macOS, where tools run under Seatbelt.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      # The image's stable can lag the rust-version, and install reuses it.
      - run: rustup update stable
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: harnesses/pi/.nvmrc
      - run: cargo xtask test
      - run: cargo xtask acceptance
      - run: cargo xtask harness
      - run: cargo xtask node

  # The window on Windows.
  clippy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p hamlet_app --all-targets -- -D warnings

  # hamlet_os on NTFS (links, junctions and Job Objects), and the
  # server in insecure mode with Git Bash. The binaries it builds are
  # the ones the Windows VM installs.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: harnesses/pi/.nvmrc
      - run: npm ci --prefix harnesses/pi
      - run: cargo test --locked ${{ env.WINDOWS_SERVER_TESTS }}
      - run: cargo build --locked -p hamlet_cli -p hamlet_server -p hamlet_app
      # The CLI starts a server in insecure mode in the foreground and
      # in the background, reports it and stops it. The window is a
      # program that exits at once, and the background server's model
      # is a loopback address nothing answers.
      - name: Start, report and stop a server
        shell: bash
        run: |
          set -eu
          hamlet=target/debug/hamlet.exe
          echo '{"responses": ["hi"]}' > "$RUNNER_TEMP/faux.json"
          ready() {
            for _ in $(seq 60); do
              "$hamlet" status && return 0
              sleep 1
            done
            cat "$HAMLET_HOME/server.log" || true
            return 1
          }
          stopped() {
            "$hamlet" stop
            if "$hamlet" status; then return 1; fi
            test ! -e "$HAMLET_HOME/server.json"
          }
          export HAMLET_HOME="$RUNNER_TEMP/foreground"
          "$hamlet" server --insecure --port 0 --faux "$RUNNER_TEMP/faux.json" &
          ready
          stopped
          export HAMLET_HOME="$RUNNER_TEMP/background"
          export HAMLET_APP="$SYSTEMROOT/System32/whoami.exe"
          export HAMLET_MODEL=local::org/large
          export HAMLET_BASE_URL=http://127.0.0.1:9/v1
          "$hamlet" --insecure
          "$hamlet" status
          stopped
      - uses: actions/upload-artifact@v4
        with:
          name: hamlet-windows
          path: |
            target/debug/hamlet.exe
            target/debug/hamlet_server.exe
            target/debug/hamlet_app.exe
      # After the upload, so the binaries are kept when these tests fail.
      - run: cargo test --locked --no-fail-fast ${{ env.WINDOWS_HOST_TESTS }}

  # The tests of the crates a pull request changes, on macOS and
  # Windows, beside the full jobs: an answer in minutes for code that
  # differs by system.
  test-changed:
    if: github.event_name == 'pull_request'
    name: test-changed-${{ matrix.system }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macos
            runner: macos-latest
          - system: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
          # The merge commit and its parents: the first is the base.
          fetch-depth: 2
      # On the full job's toolchain, so its cache is found: macOS's
      # image's stable can lag the rust-version, and install reuses it.
      - if: matrix.system == 'macos'
        run: rustup update stable
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - shell: bash
        run: |
          set -eu
          changed=$(git diff --name-only HEAD^1 HEAD -- crates)
          packages=
          for crate in $(echo "$changed" | cut -d/ -f2 | sort -u); do
            [ -f "crates/$crate/Cargo.toml" ] || continue
            if [ "$RUNNER_OS" = Windows ]; then
              case " $WINDOWS_SERVER_TESTS $WINDOWS_HOST_TESTS " in
                *" -p $crate "*) ;;
                *) continue ;;
              esac
            fi
            packages="$packages -p $crate"
          done
          if [ -z "$packages" ]; then
            echo "The pull request changes no crate."
            exit 0
          fi
          cargo test --locked --no-fail-fast $packages
