name: CI
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# No debug info and no incremental build: with them the runner has too
# little room to link every test and example, and the linker is killed.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

# Stable is the toolchain rust-toolchain.toml names, which a bare
# `rustup toolchain install` installs. Formatting uses the nightly
# named in rust-nightly. The Linux and macOS jobs run `cargo xtask`
# steps by name, which pass --locked to cargo since GitHub sets CI.
jobs:
  lints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - run: rustup toolchain install "$(cat rust-nightly)" --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Prebuilt binaries, at the versions the checks were set up on.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,typos@1.51.1
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo xtask lints

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo xtask doc

  # Faux and loopback providers only. `cargo xtask test` runs the doc
  # tests too.
  test:
    # This image permits bubblewrap's unprivileged user namespaces.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: harnesses/pi/.nvmrc
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev bubblewrap
      - run: cargo xtask test
      - run: cargo xtask acceptance
      - run: cargo xtask harness
      - run: cargo xtask node

  # The test job's steps on macOS, where tools run under Seatbelt.
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: harnesses/pi/.nvmrc
      - run: cargo xtask test
      - run: cargo xtask acceptance
      - run: cargo xtask harness
      - run: cargo xtask node

  # Windows runs only the window, as a remote client.
  clippy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # vendor/fynix is a submodule.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p hamlet_app --all-targets -- -D warnings
