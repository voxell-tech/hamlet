name: CI
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# No debug info and no incremental build: with them the runner has too
# little room to link every test and example, and the linker is killed.
env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

# Stable is the toolchain rust-toolchain.toml names, which a bare
# `rustup toolchain install` installs. Formatting uses the nightly
# named in rust-nightly.
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install "$(cat rust-nightly)" --profile minimal --component rustfmt
      - run: cargo "+$(cat rust-nightly)" fmt --all -- --check
      - run: cargo "+$(cat rust-nightly)" fmt --manifest-path xtask/Cargo.toml -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo clippy --locked --workspace --all-features --all-targets -- -D warnings
      # xtask is a workspace of its own, outside the one above.
      - run: cargo clippy --locked --manifest-path xtask/Cargo.toml -- -D warnings

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: false
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo doc --locked --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    # This image permits bubblewrap's unprivileged user namespaces.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: harnesses/pi/.nvmrc
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev bubblewrap
      - run: npm ci --prefix harnesses/pi
      - run: npm run check --prefix harnesses/pi
      - run: npm test --prefix harnesses/pi
      # Faux and loopback providers only. The acceptance suite runs the
      # plain binaries; the harness tests rebuild the server with fault
      # points, so they come last.
      - run: cargo build --locked -p hamlet_cli -p hamlet_server
      - run: cargo test --locked --workspace --all-targets --features hamlet_acceptance/acceptance
      - run: cargo test --locked -p hamlet_server --all-targets --features harness

  # The test job's steps on macOS, where tools run under Seatbelt.
  test-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: harnesses/pi/.nvmrc
      - run: npm ci --prefix harnesses/pi
      - run: npm run check --prefix harnesses/pi
      - run: npm test --prefix harnesses/pi
      - run: cargo build --locked -p hamlet_cli -p hamlet_server
      - run: cargo test --locked --workspace --all-targets --features hamlet_acceptance/acceptance
      - run: cargo test --locked -p hamlet_server --all-targets --features harness

  # Windows runs only the window, as a remote client.
  clippy-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --locked -p hamlet --all-targets -- -D warnings

  # cargo test --all-targets leaves out doc tests.
  doctest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sudo apt-get update; sudo apt-get install --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev
      - run: cargo test --locked --workspace --doc
