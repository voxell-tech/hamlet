# Installs the compiler rust-toolchain.toml pins, with its components
# and targets. A native plugin is loaded only by a Hamlet built with
# the very compiler it was built with, so no job builds with another.
name: Pinned toolchain
description: Installs the toolchain rust-toolchain.toml pins.

inputs:
  target:
    description: A target to add to the ones the file names.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: pinned
      shell: bash
      run: |
        channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
        [ -n "$channel" ] || { echo "rust-toolchain.toml names no channel" >&2; exit 1; }
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pinned.outputs.channel }}
        components: clippy, rustfmt
        targets: wasm32-wasip2${{ inputs.target && format(', {0}', inputs.target) || '' }}
