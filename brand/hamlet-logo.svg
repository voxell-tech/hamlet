<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="56%" r="70%">
      <stop offset="0" stop-color="#2b1c0e"/>
      <stop offset="0.55" stop-color="#1a120b"/>
      <stop offset="1" stop-color="#120e0a"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff9a3c" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ff9a3c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff9a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="face" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#fff1cf"/>
      <stop offset="0.55" stop-color="#ffd58a"/>
      <stop offset="1" stop-color="#f2a94a"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0b25a"/>
      <stop offset="1" stop-color="#b98531"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a1b"/>
      <stop offset="1" stop-color="#2a1e13"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <g transform="translate(540 540)">
    <circle cx="0" cy="70" r="470" fill="url(#halo)"/>
    <!-- the bobble of its hat -->
    <circle cx="0" cy="-292" r="46" fill="#e0b25a"/>
    <!-- chimney -->
    <rect x="128" y="-212" width="62" height="120" rx="12" fill="#8f6526"/>
    <!-- walls -->
    <rect x="-212" y="-40" width="424" height="330" rx="44" fill="url(#wall)" stroke="#c9983f" stroke-width="14"/>
    <!-- roof, worn as a hat -->
    <path d="M -292 -18 L -34 -252 Q 0 -280 34 -252 L 292 -18 Q 312 4 284 22 L -284 22 Q -312 4 -292 -18 Z"
          fill="url(#roof)" stroke="#f0cf86" stroke-width="6" stroke-linejoin="round"/>
    <!-- the lit window, and the face in it -->
    <rect x="-132" y="62" width="264" height="188" rx="40" fill="url(#face)" stroke="#fff1cf" stroke-width="6"/>
    <ellipse cx="-52" cy="150" rx="19" ry="33" fill="#3a2410"/>
    <ellipse cx="52" cy="150" rx="19" ry="33" fill="#3a2410"/>
    <ellipse cx="-46" cy="138" rx="6" ry="9" fill="#fff1cf" opacity="0.85"/>
    <ellipse cx="58" cy="138" rx="6" ry="9" fill="#fff1cf" opacity="0.85"/>
  </g>
</svg>
